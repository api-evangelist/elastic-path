    url: openapi/elastic-path-subscriptions-api-openapi.yml
  - type: Documentation
    url: https://developer.elasticpath.com/api
- aid: elastic-path:elastic-path-synonym-sets-api
  name: Elastic Path Synonym Sets API
  description: >-
    Synonym Sets allow you to define groups of equivalent or related terms so that searches for one term
    also return results for its synonyms. This helps shoppers find products regardless of the specific
    terminology they use.


    ### How Synonym Sets Work


    A synonym set is a named container of synonym items. Each set belongs to an organization or store
    and is synced asynchronously. Once synced, a set can be attached to one or more search profiles; its
    synonym rules are then applied during searches that use those profiles to expand queries with matching
    terms.


    ### Synonym Types


    Each item within a synonym set can be either multi-way or one-way:


    - **Multi-way synonyms**: All terms are treated as equivalent. Searching for any term in the list
    returns results for all of them. For example, `["sneakers", "trainers", "running shoes"]` means a
    search for "trainers" also returns results for "sneakers" and "running shoes".

    - **One-way synonyms**: Searches for a `root` term also match the `synonyms`, but not vice versa.
    For example, with `root: "jacket"` and `synonyms: ["blazer", "coat"]`, searching for "jacket" also
    returns results for "blazer" and "coat", but searching for "blazer" does not return results for "jacket".


    ### Synonym Item Configuration


    Each item within a synonym set supports the following options:


    | Option             | Required | Description                                                                                                  |

    |--------------------|----------|--------------------------------------------------------------------------------------------------------------|

    | `id`               | Yes      | Unique identifier for the item within the set. Alphanumeric characters,
    hyphens, and underscores only.       |

    | `synonyms`         | Yes      | List of synonym terms. Minimum 1 if `root` is provided (one-way),
    minimum 2 if `root` is absent (multi-way). |

    | `root`             | No       | Makes this a one-way synonym. Must not also appear in the `synonyms`
    array.                                  |

    | `locale`           | No       | ISO 639 language code for this synonym item.                                                                 |

    | `symbols_to_index` | No       | Special characters to preserve as part of tokens. Each element must
    be exactly one character.                |


    ### Sync Status


    Synonym sets are synced asynchronously. The sync status is tracked and exposed in API responses:


    | Status           | Description                                                    |

    |------------------|----------------------------------------------------------------|

    | `pending_sync`   | Set has been created or updated in MongoDB but not yet synced  |

    | `synced`         | Set has been successfully synced                               |

    | `sync_failed`    | The last sync attempt failed                                   |

    | `pending_delete` | Set is marked for deletion; a background worker will remove it |


    ### Tenancy


    Synonym sets follow the same tenancy model as other resources:


    - **Organization-scoped sets**: Managed by the organization; apply across all stores

    - **Store-scoped sets**: Managed by the store; apply only to that store


    Stores cannot modify organization-scoped synonym sets.


    ### Using Synonym Sets in Search Profiles


    Synonym sets only take effect once they are attached to a [search profile](/docs/api/pxm/catalog-search/search-profiles)
    via its `synonym_sets` attribute. At search time, the synonym sets of the resolved search profile
    are applied to the query.


    When attaching a synonym set to a search profile:


    - The set must exist and be accessible by the calling tenant. Organization-level search profiles may
    only reference organization-level sets; store-level search profiles may reference organization-level
    and same-store sets.

    - The set must have been synced at least once. A set in `pending_sync` or `sync_failed` state can
    still be used if it was previously synced — its last synced state continues to apply.


    A synonym set cannot be deleted while it is referenced by any search profile; the delete request is
    rejected with a `409 Conflict` until the reference is removed.


    ### Use Cases


    - **Regional terminology**: Map British and American English terms (e.g., "trousers" ↔ "pants")

    - **Brand equivalents**: Link product category names with common alternatives

    - **Industry jargon**: Ensure technical terms match colloquial ones

    - **Abbreviations**: Map abbreviations to their full forms (e.g., "tee" → "t-shirt")
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Synonym Sets
  properties:
  - type: OpenAPI
    url: openapi/elastic-path-synonym-sets-api-openapi.yml
  - type: Documentation
    url: https://developer.elasticpath.com/api
- aid: elastic-path:elastic-path-tax-items-api
  name: Elastic Path Tax Items API
  description: >-
    Taxes differ by country and can differ within the country by region, state, or province. Each jurisdiction
    has a unique tax code and rate. If your store serves many jurisdictions, integrate a third-party tax
    generator to manage taxes. If your store serves a few jurisdictions, you can use the API to define
    the tax codes and rates in Composable Commerce.


    Taxes are calculated after all promotional discounts have been applied. When calculating taxes on
    a cart or order, you can choose from the following methods for calculating taxes:

      - Simple calculation method: Taxes are calculated at the unit level and are rounded to the nearest
    penny for the unit.
      - Line calculation method: Default. Taxes are calculated at the line level and are rounded to the
    nearest penny for the line.
        For more information about calculation methods, see [Calculate cart and order totals](/guides/How-To/Carts/calculate-totals).

    Tax values can be either `rate` or `amount`.
      - `rate` - Represents the tax as a percentage in decimal form.
      - `amount` - Represents a tax amount.

    :::note

    Tax items can be added and removed using [client_credentials access tokens](/docs/api/authentication/create-an-access-token).
    Only administrators with `client-credentials` access tokens are able to manage tax items.

    :::
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
