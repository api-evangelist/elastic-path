- aid: elastic-path:elastic-path-subscriptions-api
  name: Elastic Path Subscriptions API
  description: "Elastic Path Subscriptions enables you to manage your subscriptions plans and pricing\
    \ options, using offerings. Offerings can contain any combination of pricing options and a plan. When\
    \ a customer chooses a pricing option, a subscription is created.  \n\n### Managing the Subscription\
    \ Lifecycle\n\nThe subscription lifecycle is the states that a subscription can go through when a\
    \ customer subscribes to a service or a plan. \n\nA subscription can have the following states:\n\n\
    - `pending`\n- `canceled`\n- `paused`\n- `resumed`\n\n#### Creating a pending subscription \n\nA subscription\
    \ can be created in a `pending` state. This is useful for several reasons.\n\n- If there are subscriptions\
    \ that require user setup or onboarding, for example, installing software or setting up preferences.\
    \ This helps reduce shopper frustration during the onboarding process, as the shopper is not paying\
    \ for a service that they cannot use yet.\n- When offering a free trial or promotion, keeping the\
    \ subscription in a pending state until the trial or promotion starts or ends allows you to manage\
    \ transitions more smoothly. \n- Before a subscription becomes active, you may need to verify the\
    \ payment method or authorize the first payment. Keeping the subscription in a pending state allows\
    \ time to complete these steps without activating the subscription.\n\nFor a subscription with a `pending`\
    \ state, you can also configure a `go_live_after` date. The subscription starts from the `go_live_after`\
    \ date. This is useful as it ensures both the subscription provider and subscriber are clear about\
    \ when a subscription officially begins. Once the `go_live_after` date is passed, the subscription\
    \ becomes `active`, initiating the billing and payment runs. If a subscription is activated this way,\
    \ you can see this in the `timestamp` meta.   \n\nYou can configure a `go_live_after` date to be a\
    \ past date. This is useful, for example, for backdating a subscription or managing a delay in activating\
    \ a subscription. Setting the `go_live_after` date in the past ensures the subscriptions timeline\
    \ correctly aligns with the agreed-upon service start date. \n\n:::caution\n\nAlthough, billing runs\
    \ generate one invoice per subscription, if a `go_live_date` is set far in the past, multiple invoices\
    \ could be generated over the course of several billing runs, which could be frustrating and confusing\
    \ to your subscribers. \n\n:::\n\nSee [create a subscription](/docs/api/subscriptions/create-subscription).\n\
    \n#### Cancelling or pausing and resuming subscriptions\n\nA subscriber can decide to cancel or pause\
    \ and/or resume a subscription. The following example describes pausing or canceling and resuming\
    \ a subscription.\n\n1. The subscriber pauses or cancels the subscription. \n   - The subscription\
    \ status is `active`. \n   - either `paused` or `cancelled` is set to `true`.\n   - either the `paused_at`\
    \ or `cancelled_at` timestamp is populated with the date and time the subscription is paused or cancelled.\n\
    \   - for cancelled subscriptions, `end_date` indicates when the subscription will expire and end.\n\
    2. When the next billing run is due, the billing run checks the subscription state. If the subscription\
    \ state is paused or cancelled then no invoice is created and the subscription status is updated to\
    \ `inactive`.\n3. Subsequent billing runs skip that subscription completely as the subscription status\
    \ is `inactive`.\n4. If the subscriber resumes the subscription:\n   - either `paused` or `cancelled`\
    \ is set to `false`.\n   - the `resumed_at` timestamp is populated with the date and time the subscription\
    \ is resumed.\n5. When the next billing run is due, the billing run checks the subscription state.\
    \ If the `paused` or `cancelled` is set to `false` then the billing run creates an invoice.\n6. The\
    \ payment run processes the invoice. Once the payment succeeds then the payment run updates the status\
    \ of the subscription to `active`.\n\n### Orders\n\nWhen a customer chooses a subscription, they need\
    \ to add the subscription to a cart, checkout the cart and then pay for the order. \n\n1. When a customer\
    \ adds a subscription to cart, this is handled using the `Add subscription to cart` endpoint. \n2.\
    \ Once a subscription has been added to a cart, the [**Checkout API**](/docs/api/carts/checkout-api)\
    \ converts the cart to an order. \n3. Once the order is created, payment needs to be taken. This is\
    \ handled by Elastic Path Payments Powered by Stripe. See [**Payments**](/docs/api/subscriptions/invoices#payments)."
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Subscription
