- aid: elastic-path:elastic-path-rules-api
  name: Elastic Path Rules API
  description: >-
    If your store requires multiple catalogs, add catalog rules to control when a catalog is displayed.
    A catalog rule contains a catalog plus the criteria under which to display the catalog.


    :::caution


    You cannot create catalog rules for organization catalogs.


    :::


    You can use catalog rules to schedule a catalog to appear during a particular period, such as on a
    specific date or during summer. The catalog might offer different pricing during this period. The
    pricing depends on the associated price book.


    The following scenarios provides a few examples for using catalog rules.


    - **Multiple geographical regions**. Display different catalogs in different regions with suitable
    pricing or combine product hierarchies from two different regions to display in a third region.

    - **Multiple channels**. Display different catalogs based on how a shopper accesses your store, such
    as through a mobile app or a web storefront.

    - **Direct to business versus direct to customers**. Offer different products and prices for business
    customers versus retail customers.

    - **Preferred accounts**. Offer special pricing to a group of users while displaying a standard price
    catalog to other users.

    - **Preferred customers**. Offer special pricing to preferred customers while displaying a standard
    price catalog to all other shoppers.

    - **Reward programs**. Enable reward programs where catalog prices drop after a certain spending level
    is reached.

    - **Product sales**. Offer sale items for a limited time.

    - **Standard pricing**. Display a default catalog to the shoppers who do not meet the criteria of
    the other catalog rules.


    You can define a catalog rule with any of the following criteria.


    - **Accounts**. List the accounts that should see a catalog. When a user has logged in with the account,
    they see the configured catalog.

    - **Customers**. List the customers that should see a catalog. When the customer is logged in, they
    see the configured catalog.

    - **Channel**. Specify a shopper experience, such as web storefront or mobile app. Set up the channel
    to retrieve the catalog from the catalog rule that matches that channel.

    - **Other tags**. Create your own user-defined tags. For example, you might want to tag by regions
    or you might want to distinguish between business and consumer customers.


    If a catalog rule has no criteria defined, it is the default catalog rule.


    ### Resolving catalog rules


    When there is a request for a catalog, the store displays the catalog with the rule that matches the
    most attributes of the shoppers context.


    The request triggers the following steps:


    1. Compares the shoppers context against the defined catalog rules.

    1. Determines the best match.

    1. Retrieves the catalog associated with the matching catalog rule.


    The follow examples show how the best match might be resolved:


    - A shopper matches one of the `customer_ids` in one catalog rule only. The catalog for that catalog
    rule is displayed.

    - A shopper matches one of the `customer_ids` in one catalog rule only, but doesnʼt match any of the
    `tags` specified in that catalog rule. Because there are no other catalog rules for this `customer_id`,
    the catalog for the catalog rule is displayed because it is the best match.

    - A shopper is browsing a store using the stores mobile app, which matches `channel=mobile` in two
    catalog rules. The catalog displayed depends on matches with the `tags` or `customer_ids` attributes.
    If there is no other matching attribute, the first catalog rule found by the store is used. The best
    practice is to create catalog rules that cover all cases so that you avoid this situation.

    - An unknown shopper is browsing the only channel offered by the seller. The store displays the base
    catalog.
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Rules
  properties:
  - type: OpenAPI
    url: openapi/elastic-path-rules-api-openapi.yml
  - type: Documentation
    url: https://developer.elasticpath.com/api
- aid: elastic-path:elastic-path-schedules-api
  name: Elastic Path Schedules API
  description: "You can schedule your billing, tax, and payment runs. By scheduling billing, tax, and\
    \ payment runs, you automate the process, reducing manual intervention and ensuring the jobs are run\
    \ in a timely manner.  You can define a schedule in the format (`* * * * *`) which is a set of five\
    \ fields in a line, indicating when a job should be executed. For example, you can define a schedule\
    \ so that your job runs multiple times a day, or runs on specific days and months.\n\nSubscriptions\
    \ runs on Coordinated Universal Time (UTC) time and conforms to [**RFC 3339**](https://www.rfc-editor.org/rfc/rfc3339).\
    \ \n\n### Unrestricted fields\n\nSetting a field to an asterisk (`*`) is sometimes referred to as\
    \ leaving a field unrestricted because it is not restricted to a specific value.\n\nYou can use the\
    \ asterisk (`*`) to indicate the range of all values for the field. When you use the asterisk, the\
    \ first value in the range is: 0 for the minute, hour, and day of the week (Sunday) fields, and 1\
    \ for day of the month and the month fields.\n\n### Configuring fields\n\nThe time fields have the\
    \ following format and possible values and must be specified in the following order:\n\n| Field |\
    \ Format | Description  |                                                                        \
    \                            \n| --- | --- | -----|\n| Minute | 0-59 | Indicates how far past the\
    \ top of the hour your job runs, in minutes. For example if a minute is set to 0, then the job runs\
    \ at the top of the hour because it is 0 minutes after the hour. This means if the hour is 8.00 AM,\
    \ the job runs at 8.00 AM. |\n| Hour | 0-23 | Indicates how far past midnight your job runs, in hours.\
    \ This is rounded down to the nearest hours. This is because minutes are indicated by the minute field.\
    \ |\n| Day of the month | 0-31 | Indicates the calendar date of the month. For example, 1 for the\
    \ first day of the month. |\n| Month | 1-12 or JAN to DEC | Indicates the month. Specify the month\
    \ number or the first three letters of the month name in uppercase. For example, 1 or JAN for January.\
    \  |\n| Day of the week | 0-6 (or SUN to SAT, or 7 for Sunday) | Indicates the day of the week. Monday\
    \ is 1, Tuesday is 2, and so on. Either 0 or 7 indicates Sunday. Alternatively, specify the day of\
    \ the week using the first three letters of the weekday name in uppercase. For example SUN for Sunday.\
    \ If you use this field with the day of the month field, then this field is evaluated as an inclusive\
    \ OR. For example, if the day of the month is set to 1 and the day of the week is set to SAT, the\
    \ job runs on the first day of the month and on every Saturday of the month, even if the first day\
    \ of the month is not a Saturday. If the day of the week is marked by an asterisk (*) then the field\
    \ is marked as unrestricted. This means the job only runs on the first day of the month. |\n\n###\
    \ Matching all values\n\nTo match all values for a field, set the field to an asterisk (`*`). When\
    \ a field is set to an asterisk, the field matches all valid values for that field whenever the other\
    \ field conditions are satisfied. \n\n Here are some examples.\n\n - `* 0 1 1 1`: the job runs every\
    \ minute of the midnight hour on January 1st and Mondays.\n - `* * * * *`: the job runs every minute\
    \ (of every hour, of every day of the month, of every month, every day of the week, because each of\
    \ these is unrestricted).\n\n ### Matching a range\n\n To match a range of values, specify your start\
    \ and stop values, separated by a hyphen (`-`). Do not include spaces in the range. Ranges are inclusive.\
    \ The first number must be less than the second number. If you are using abbreviated names for the\
    \ month or weekday (for example, JAN instead of 1 for the first month of the year), the first value\
    \ must come earlier in the month or week than the second value.\n\nThe following equivalent examples\
    \ run at midnight on Mondays, Tuesdays, Wednesdays, Thursdays, and Fridays (for all months):\n\n -\
    \ `0 0 * * 1-5`\n - `0 0 * * MON-FRI`\n\n### Matching a list\n\nLists can contain any valid value\
    \ for the field, including ranges. Specify your values, separated by a comma (,). Do not include spaces\
    \ in the list.\n\nExamples:\n\n- `0 0,12 * * *`: the job runs at midnight and noon.\n- `0-5,30-35\
    \ * * * *`: the job runs in each of the first five minutes of every half hour (at the top of the hour\
    \ and at half past the hour).\n\n### Skipping values in a range\n\nYou can skip values in a range\
    \ by specifying a rate at which to step through the range. To do this, specify the range, followed\
    \ by the forward slash (`/`) and the rate at which you want to skip through the range.\n\nThe step\
    \ value cannot be larger than the largest possible value for the field. The default step is 1, so\
    \ the step function `/1` is the same as not using a step function at all.\n\nExample ranges that use\
    \ step functions:\n\n- `*/2`: this is a valid step function for any field. \n    - For the minute\
    \ field, it matches 0, 2, 4, ... , 58. \n    - For the hour, it matches 0, 2, 4, ... , 22. \n    -\
    \ For the day of the month, it matches 1, 3, 5, ... , 31 (for a month with 31 days). \n    - For the\
    \ month, it matches 1, 3, 5, ... , 11. \n    - For the day of the week, it matches 0, 2, 4, 6.\n\n\
    - `0-12/2`: this is a valid step function for the minute and hour fields. It matches 0, 2, 4, ...\
    \ , 12.\n\nExample schedules using step functions:\n\n- `*/2 * * * *`: the job runs every two minutes.\n\
    - `0 0-12/2 * * *`: the job runs every two hours, on the hour. The first run is at midnight. The last\
    \ run is at noon."
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Schedules
  properties:
  - type: OpenAPI
    url: openapi/elastic-path-schedules-api-openapi.yml
  - type: Documentation
    url: https://developer.elasticpath.com/api
- aid: elastic-path:elastic-path-search-api
  name: Elastic Path Search API
  description: >-
    The Search API enables you to search for products in your published catalogs. Search provides powerful
    capabilities including full-text search, filtering, faceting, and sorting to help shoppers find products
    quickly and efficiently.


    ### How Search Works


    When you publish a catalog with search enabled, the catalog's products are automatically indexed for
    search. The search index contains product data optimized for fast querying, including product names,
    descriptions, SKUs, categories, prices, and any custom fields you've configured.


    There are two types of search operations:


    - **Search**: Execute a single search query against a catalog. Use the GET endpoint for simple searches
    with query parameters.

    - **Multi-search**: Execute multiple search queries in a single request. Use the POST endpoint to
    batch searches together for improved performance.


    ### Search Features


    - **Full-text search**: Search across product names, descriptions, SKUs, and custom fields with typo
    tolerance and relevance ranking

    - **Filtering**: Narrow results using conditions on product attributes, categories, prices, and custom
    fields

    - **Faceting**: Get aggregated counts for attribute values to build dynamic navigation and refinement
    options

    - **Sorting**: Order results by price, name, custom fields, or relevance score

    - **Highlighting**: Get highlighted snippets showing where search terms match in product fields

    - **Autocomplete**: Get search suggestions as shoppers type their queries


    ### Shopper Context


    Search results are personalized based on the shopper's context. The system automatically determines
    which catalog and prices to use based on:


    - **Channel**: The shopping experience (web, mobile, B2B portal)

    - **Account**: For B2B scenarios, the account and parent accounts

    - **Customer**: The logged-in customer's segment

    - **Tags**: Custom context tags for advanced segmentation


    This context is provided via request headers and is used to resolve the appropriate catalog rules
    and price books.


    ### Admin vs Shopper Endpoints


    - **Shopper endpoints** (`/pcm/catalog/search`, `/pcm/catalog/multi-search`): Use shopper context
    headers to automatically resolve the correct catalog and prices.

    - **Admin endpoints** (`/pcm/catalogs/{catalog_id}/releases/{release_id}/search`): Directly specify
    the catalog and release to search, useful for previewing releases or testing.
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Search
  properties:
  - type: OpenAPI
    url: openapi/elastic-path-search-api-openapi.yml
  - type: Documentation
    url: https://developer.elasticpath.com/api
- aid: elastic-path:elastic-path-search-indexes-api
  name: Elastic Path Search Indexes API
  description: >-
    Search Indexes represent the indexed data for your catalog releases. Each time a catalog is published
    with search enabled, a search index is created containing the product data optimized for fast querying.


    ### Index Status


    The Search Indexes API allows you to view the status of your indexes and identify any that are out
    of sync. An index becomes out of sync when:


    - Indexable fields have been added, modified, or deleted

    - The index failed to build during catalog publishing

    - A reindex is required due to schema changes


    ### Monitoring Indexes


    Use the list endpoint to:


    - **View all indexes**: See all search indexes for your store

    - **Check sync status**: Identify indexes that need reindexing

    - **Filter by status**: Find only out-of-sync indexes using the `out_of_sync` query parameter


    ### Index Information


    Each search index includes:


    | Property      | Description                                             |

    |---------------|---------------------------------------------------------|

    | `catalog_id`  | The ID of the catalog this index belongs to             |

    | `release_id`  | The ID of the catalog release this index was built from |

    | `out_of_sync` | Whether the index needs to be rebuilt                   |


    ### Reindexing


    When indexes are out of sync, use the reindex endpoint in [Jobs](/docs/api/pxm/catalog-search/jobs)
    to rebuild them. Reindexing ensures your search indexes reflect the current indexable field configuration.
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Search Indexes
  properties:
  - type: OpenAPI
    url: openapi/elastic-path-search-indexes-api-openapi.yml
  - type: Documentation
    url: https://developer.elasticpath.com/api
- aid: elastic-path:elastic-path-search-profiles-api
  name: Elastic Path Search Profiles API
  description: >-
    Search Profiles are configuration objects that control how search queries are executed. They provide
    a powerful way to customize search relevance, filtering, and ranking without requiring code changes,
    enabling merchandisers and business users to optimize the search experience.


    ### How Search Profiles Work


    A Search Profile defines:


    - **Which fields to search**: Select which product fields are included in search queries

    - **Field weights**: Assign relative importance to each field for relevance ranking

    - **Default filters**: Apply business rules that filter results for all searches

    - **Boost rules**: Promote or demote products based on specific conditions

    - **Match type**: Control how scores from multiple fields are combined


    When a search request is made, the system uses the specified profile (or the default profile) to configure
    the search behavior.


    ### Search Profile Components


    | Component         | Description                                                                               |

    |-------------------|-------------------------------------------------------------------------------------------|

    | `slug`            | Unique identifier used to reference the profile in search requests                        |

    | `fields`          | List of fields to search with optional weights for relevance ranking                      |

    | `filters`         | Default filter expressions applied to all searches using this profile                     |

    | `boosts`          | Rules for promoting or demoting products based on conditions                              |

    | `text_match_type` | How to combine scores when multiple fields match (`max_score`, `max_weight`,
    `sum_score`) |


    ### Field Weights


    Field weights control how important each field is when ranking search results. Higher weights mean
    matches in that field contribute more to the relevance score. Weights must be in the range `[0, 15]`.


    **Example**: A profile with `name` (weight 10) and `description` (weight 5) will rank products with
    search term matches in the name higher than those with matches only in the description.


    ### Filters


    Profile filters enforce business rules that apply to all searches:


    - Ensure only live/published products appear in results

    - Restrict results to specific categories or channels

    - Hide products based on visibility settings


    Multiple filters are combined with OR logic, then ANDed with any filters in the search request.


    ### Boost Rules


    Boost rules allow you to promote or demote products in search results:


    - **Positive weights**: Push matching products to the top of results

    - **Negative weights**: Push matching products to the bottom (burying)

    - **Zero weight**: No effect on ranking


    Rules are evaluated in weight order, and the first matching rule determines the product's boost.


    ### Text Match Types


    | Type         | Description                                                                            |

    |--------------|----------------------------------------------------------------------------------------|

    | `max_score`  | Uses the highest score from any single matching field. Prioritizes match quality.      |

    | `max_weight` | Uses the score from the highest-weighted matching field. Prioritizes field importance.
    |

    | `sum_score`  | Sums weighted scores from all matching fields. Rewards multi-field matches.            |


    ### Default Profile


    Each store has a default search profile that is used when no profile is specified in the search request.
    You can set any profile as the default using the set default endpoint.


    ### Use Cases


    - **A/B testing**: Create multiple profiles with different configurations to test search relevance

    - **Channel optimization**: Different profiles for web, mobile, and B2B channels

    - **Seasonal merchandising**: Profiles that boost seasonal or promotional products

    - **Customer segmentation**: Different ranking strategies for different customer tiers
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Search Profiles
  properties:
  - type: OpenAPI
    url: openapi/elastic-path-search-profiles-api-openapi.yml
  - type: Documentation
    url: https://developer.elasticpath.com/api
- aid: elastic-path:elastic-path-searchable-fields-api
  name: Elastic Path Searchable Fields API
  description: >-
    The Searchable Fields API returns a list of all fields available for searching, filtering, faceting,
    and sorting in your search queries. This includes both the standard product fields that are indexed
    by default and any custom fields you've added through Indexable Fields.


    ### Using Searchable Fields


    Use this endpoint to:


    - **Discover available fields**: See all fields that can be used in search queries

    - **Build dynamic UIs**: Programmatically generate filter and facet options based on available fields

    - **Validate configurations**: Verify that your indexable fields have been properly added to the schema


    ### Field Properties


    Each searchable field includes:


    | Property | Description |

    | --- | --- |

    | `name` | The field name to use in search queries |

    | `type` | The data type (`string`, `int32`, `int64`, `float`, `bool`) |

    | `facetable` | Whether the field can be used for faceting |

    | `sortable` | Whether the field can be used for sorting |

    | `locale` | The language code for text fields |


    ### Standard vs Custom Fields


    - **Standard fields**: Built-in fields like `name`, `description`, `sku`, `meta.search.nodes.name`
    that are always available

    - **Custom fields**: Fields added through Indexable Fields from your product extensions
