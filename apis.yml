- aid: elastic-path:elastic-path-invoices-api
  name: Elastic Path Invoices API
  description: "Invoices represent the amount a customer owes for a subscription. Elastic Path Subscriptions\
    \ generates an invoice for every period in a subscription billing cycle. Invoices provide:\n\n- an\
    \ itemized list of goods and services provided by a subscription.\n- the cost of a subscription.\n\
    - if applicable, any taxes.\n\nThe invoice lifecycle is described below.\n\n1. When a subscription\
    \ is created, an invoice for the first billing period is created. When a subscription is created as\
    \ part of an order, the payment for the order covers the first billing period.\n2. Subscription invoices\
    \ are created by [**billing runs**](/docs/api/subscriptions/jobs). The billing run identifies subscriptions\
    \ that require a new invoice for their next billing period and creates them. At this point, invoices\
    \ are marked as outstanding.\n3. Invoices where `tax_required` is `true` will not have payment taken\
    \ until a tax run has added the required tax to the invoice.  \n3. The [**payment run**](/docs/api/subscriptions/jobs)\
    \ identifies invoices that are still outstanding and attempts to take payment for them. If the payment\
    \ succeeds the the invoice is no longer outstanding. If the payment fails for any reason, then the\
    \ invoice remains outstanding and is picked up by the next payment run to retry the payment. If an\
    \ invoice has a failed payment, payment is only retried if the fixed interval has passed from the\
    \ last payment attempt as defined in Settings.\n\n### Payment Retries\n\nIt is important to limit\
    \ the number of times Subscriptions retries a failed payment request for many reasons, including:\
    \ frequent payment retries can indicate fraudulent activities; multiple failed payment attempts can\
    \ lead to customers accounts being locked out or flagged for suspicious activity resulting in poor\
    \ customer experience; and excessive retries places an unnecessary load on your payment processing\
    \ system.\n\nIn Subscriptions, by default, the number of payment retries is 10. You can set this to\
    \ a limit between 0 - 20, depending on your requirements. Each payment retry is made as a payment\
    \ run. \n\nOnce the number of payment retries reaches the limit, the payment retries stop, resulting\
    \ in status of the invoice being unpaid. See [Invoices](#invoices).\n\nWhen configuring payment retries,\
    \ you have the following options.\n\n| Attribute | Required | Description |\n| --- | --- | --- |\n\
    | `payment_retry_type` | Optional | One of the following options: <ul><li>`fixed` - use `fixed` if\
    \ you want a fixed time interval between payment retries.</li><li>`backoff` - use `backoff` if you\
    \ want the time between retry attempts to increase exponentially.</li><li>`tiered` - use `tiered`\
    \ if you want to specify a list of time durations.</li></ul>  |\n| `payment_retry_interval` | Optional\
    \ | Represents the retry interval. For example, if `payment_retry_unit` is `week` and `payment_retry_interval`\
    \ is `1` then, the payment retry interval is 1 week.  |\n| `payment_retry_multiplier` | Optional |\
    \ Use when `payment_retry_type` is `tiered` and represents the factor by which the time duration increases\
    \ after each retry.   |\n| `payment_retry_unit` | Optional | Represents the unit of time, either `day`\
    \ or `week`. |\n\n### Rounding\n\nSubscriptions always rounds down to the penny. \n\n### Tax\n\nSubscriptions\
    \ allows you to apply any number of tax rates to your invoices and subscriptions. When applying a\
    \ tax rate, you must specify:\n\n- a name that appears on your customer's invoice that describes the\
    \ specific type of tax.\n- the tax rate which is the percentage of the subscription amount that is\
    \ required to be paid as tax.\n\nIn addition, you can optionally specify the jurisdiction which is\
    \ the geographic area or political entity that has authority to levey and collect taxes.\n\nYou can\
    \ apply more than one tax rate for all items in an invoice. You cannot apply a tax rate per line item.\n\
    \n### Payments\n\nWhen your customers add a subscription to a cart and the cart is checked out, an\
    \ unpaid order is returned. You can process the payment for the order though a payment gateway. You\
    \ can do this using:\n\n- Elastic Path Payments Powered by Stripe. The Elastic Path Payments Powered\
    \ by Stripe gateway interacts with Stripe to allow your subscribers to pay for their subscriptions.\
    \ \n- Authorize.Net. \n\n#### Using Elastic Path Payments Powered by Stripe\n\nTo use Elastic Path\
    \ Payments Powered by Stripe gateway, contact the [**Customer Success Team**](mailto:customersuccess@elasticpath.com).\
    \ \n\nCreate your Stripe account in [**Stripe Dashboard**](https://dashboard.stripe.com/login) and\
    \ complete an onboarding form to make payments using the gateway. For more information, see [**Onboarding**](/docs/payments/onboarding).\n\
    \nOnce you have signed up for Elastic Path Payments Powered by Stripe, you must configure the payment\
    \ gateway so that your shoppers can make payments. See [**Configure Elastic Path Payments Powered\
    \ by Stripe**](/docs/payments/onboarding).\n\n#### Using Authorize.Net\n\nTo use Authorize.Net, you\
    \ must have: \n\n- an active merchant account with Authorize.Net\n- obtained API credentials. These\
    \ include an **API Login ID** and a **Transaction Key**.\n- Enabled Authorize.Net in Commerce Manager.\
    \ See [Enabling Authorize.net](/docs/commerce-manager/payments/configure-other-payment-gateways#enabling-authorizenet).\n\
    \n#### Payment Requests\n\nSubscriptions only supports the `purchase` payment mechanism. The gateway\
    \ attempts to charge the customer immediately, and the result of the attempt is returned. If a payment\
    \ fails, the invoice is kept as outstanding and the payment information, with the reason for the failure\
    \ is attached to the invoice. A new payment run is required to attempt another payment. \n\nWhen sending\
    \ a payment request to the Payments service, you must specify the following.\n\n| Attribute | Required\
    \ | Description |\n| --- | --- | --- |\n| `gateway` | Required| One of `elastic_path_payments_stripe`,\
    \ `authorize_net` and `stripe_payment_intents`. |\n| `method` | Required | Must be `purchase`.\n|\
    \ `payment` | Required | The type of payment, for example, `pm_card_visa_debit`.\n| `options` | Required\
    \ | These options must be set as they set up the card to be used in future without the customer being\
    \ present. If these options are not set, future payments may fail. There are two options. <ul><li>`off_session`.\
    \ Must be set to `true`. </li><li>`confirm`. Must be set to `true`.</li></ul> |\n\n#### External Payments\n\
    \nExternal payments are payment methods not offered by Elastic Path Subscriptions (such as Elastic\
    \ Path Payments powered by Stripe or Authorize.net), but they can still be integrated with Subscriptions.\
    \ To do this, you must configure your subscriptions to use external payments by setting `manual_payments`\
    \ to `true`. See [Create a Subscription](/docs/api/subscriptions/create-subscription).\n\nWhen a subscription\
    \ is created with `manual_payments` set to `true`:\n\n1. When the payment run processes the generated\
    \ invoice, it creates a pending payment. A `subscription-invoice-created` event is emitted that includes\
    \ the `subscription_id`, `invoice_id` and `payment_id`. No payment is taken. \n2. You can use the\
    \ events generated by Elastic Path Subscriptions to configure your external payment system to respond\
    \ to these events, ensuring that your external payment system knows when the payment schedule has\
    \ run and it's time to process the payment.\n3. When the external payment system handles the payment\
    \ (either takes the payment successfully or the payment fails) the [Update Invoice Payment](/docs/api/subscriptions/update-invoice-payment)\
    \ endpoint, enables the update of the pending payment. \n    - If payment is successful, the invoice\
    \ is updated to `paid` and the billing/payment cycle continues as normal.\n    - If payment fails,\
    \ the invoice continues to be marked as `outstanding`. The payment is not `pending` anymore. This\
    \ is because a payment attempt has been made. Following on from this, the next payment run generates\
    \ another manual pending payment. The external system is notified of this using the `subscription-invoice-payment-updated`.\n\
    \n#### Card Declines\n\nCard payments can fail for a variety of reasons, including insufficient funds,\
    \ incorrect card data or fraudulent activity. You can use the `card_id` and `customer_id` attributes\
    \ to program your front-end implementation to allow your preferred payment service provider to update\
    \ a subscription with new card details, enabling you to easily manage your subscription changes."
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Invoices
  properties:
  - type: OpenAPI
    url: openapi/elastic-path-invoices-api-openapi.yml
  - type: Documentation
    url: https://developer.elasticpath.com/api
- aid: elastic-path:elastic-path-jobs-api
  name: Elastic Path Jobs API
  description: >-
    Jobs manage the indexing operations for catalog search. When catalogs are published or when reindexing
    is required, jobs process the product data and build search indexes.


    ### Job Types


    | Type                      | Description                                                                                         |

    |---------------------------|-----------------------------------------------------------------------------------------------------|

    | `index-release`           | Index a specific catalog release. Created automatically when a search-enabled
    catalog is published. |

    | `delete-release`          | Remove the search index for a catalog release.                                                      |

    | `reindex-tenant-releases` | Reindex all catalog releases for the store. Use when indexable fields
    have changed.                 |


    ### Job Lifecycle


    Jobs progress through the following states:


    1. **pending**: Job has been created and is waiting to be processed

    2. **processing**: Job is actively indexing products

    3. **complete**: Job finished successfully

    4. **failed**: Job encountered an error


    ### Automatic Indexing


    When you publish a catalog with search enabled, an `index-release` job is automatically created. The
    catalog release remains in a publishing state until the indexing job completes successfully.


    ### Manual Reindexing


    Use the reindex endpoint when:


    - You've added, modified, or deleted indexable fields

    - Search indexes are out of sync (check via [Search Indexes](/docs/api/pxm/catalog-search/search-indexes))

    - You need to rebuild indexes after a failure


    The reindex operation creates jobs for all catalog releases that need updating. You can optionally
    force a full reindex of all releases regardless of their sync status.


    ### Conflict Handling


    Only one reindexing operation can run at a time. If you attempt to start a reindex while another is
    in progress, the API returns a 409 Conflict error.
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Job
  tags_raw:
  - Jobs
  properties:
