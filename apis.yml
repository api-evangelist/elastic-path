- aid: elastic-path:elastic-path-product-import-bulk-update-api
  name: Elastic Path Product Import/Bulk Update API
  description: "```mdx-code-block\nimport ProductImport from '/docs/partials/pxm/import/import.mdx';\n\
    \n<ProductImport />\n```\n\n#### Using Imported Main Image Files\n\nYou can use the main images that\
    \ you have previously uploaded to Commerce and assign them to your products when importing products\
    \ to Commerce. You can do this by adding a `main_image_id` header to your `.csv` file. The ID you\
    \ provide in `main_image_id` is the ID of a file that has already been uploaded to Commerce using\
    \ create a file.\n\n#### Importing Custom Data (Flows)\n\nYou can also create/update custom extension\
    \ data in a `.csv` file by creating a header that includes the flow `ID` and the field `slug` in the\
    \ following format: \n\ntemplate:*flowID*:*fieldSlug*.\n\nwhere:\n\n- `template` must be `template`.\n\
    - `flowID` is the ID of the flow that contains the field whose data you want to create/update.\n-\
    \ `fieldSlug` is the slug of the field whose data you want to create/update.\n\nIn the following example,\
    \ for a flow with ID `82c10a02-1851-4992-8ecb-d44f2782d09b` and a field with the slug `condition`:\n\
    \n- the header is `template:82c10a02-1851-4992-8ecb-d44f2782d09b:condition`.\n- the updated custom\
    \ data is `as-new`.\n\n    | name | slug | sku | status | template:82c10a02-1851-4992-8ecb-d44f2782d09b:condition\
    \ |\n    | :--- | :--- | :--- | :--- | :--- |\n    | BestEver Range | bestever-range-1a1a-30 | BE-Range-1a1a-30\
    \ | draft | as-new |\n\n#### Characteristics of CSV Import Files\n\nProduct Import uses a [**Comma\
    \ Separated Values (CSV)**](#characteristics-of-csv-import-files) file to import/update products,\
    \ main image files, and custom extension data. \n\n- Each row in a `.csv` file represents a product\
    \ you want to create/update. \n- Each file:\n    - must not be larger than 50 megabytes. If a `.csv`\
    \ file is larger than 50 megabytes, a `503 client read error` is displayed.\n    - must not have more\
    \ than 50,000 rows, including the header. If a CSV file exceeds 50,000 rows, an error is displayed,\
    \ and the products are not imported.\n    In other words, if you have a file with 50,000 rows that\
    \ is larger than 50 megabytes, an error is displayed, and the products are not imported.\n- If you\
    \ want to create/update more than 50,000 products or your `.csv` file is larger than 50 megabytes,\
    \ you must have a separate `.csv` file and import each `.csv` file one at a time.\n- You can update\
    \ existing products, including images, templates/flow fields, and entries. The entry in the `.csv`\
    \ file must have a unique `id` and/or `external_ref` that matches the `id` and `external_ref` of the\
    \ existing product you want to update. You may have both a unique `id` and `external_ref`, but you\
    \ must have at least one.\n- You can add new products. For new products that you want to add, the\
    \ entry in the `.csv` file must have an `external_ref` that does not match any existing products.\n\
    \nThe following table describes the headers that are supported.\n\n| Header | Required | Description\
    \  |\n|:---- |:---------|:--|\n| id                              | Optional | A unique product ID\
    \ that is generated when you create the product. The `id` is used to look up products in the `.csv`\
    \ file and matches them to the products in your storefront that you want to update.              \
    \                                                                                                \
    \                                                                                         |\n| external_ref\
    \                    | Optional | A unique attribute associated with a product. This could be an external\
    \ reference from a separate company system, for example. The maximum length is 2048 characters.  \
    \                                                                                                \
    \                                                                                                \
    \                                       |\n| name                            | Required | The name\
    \ of a product.                                                                                  \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \      |\n| description                     | Required | A description for a product. You can include\
    \ quotes in your product description, if you want to emphasize a word, for example. To do this, put\
    \ quotes around the product description. For example, \"This product description describes my \"product\"\
    \ and the product \"version\".\"                                                                 \
    \                                                              |\n| slug                         \
    \   | Required | A label for the product that is used in the URL paths. A slug can contain any combination\
    \ of letters, numbers, periods, hyphens, and underscores. NO spaces or other characters are allowed.\
    \ By default, the product name is used as the slug.                                              \
    \                                                                                                \
    \                  |\n| status                          | Required | The status of a product, either\
    \ `Draft` or `Live`.                                                                             \
    \                                                                                                \
    \                                                                                                \
    \                                                                               |\n| commodity_type\
    \                  | Required | The commodity type, either `physical` or `digital`.              \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                             |\n| upc_ean                         | Optional | The\
    \ universal product code or european article number of the product.                              \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \           |\n| mpn                             | Optional | The manufacturer part number of a product.\
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                    |\n| sku                    \
    \         | Optional | The unique stock keeping unit of the product.                             \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                    |\n| tags                             | Optional | The product\
    \ tags used to store or assign a key word against a product. A product can have up to 20 product tags.\
    \ A product tag can be up to 255 characters. See [**Product Tags**](/docs/api/pxm/products/product-tags).\n\
    | main_image_id                   | Optional | Specifies a unique ID of a main image file for a product.\
    \ You can include a `main_image_id` for your products for images that are already uploaded to Commerce.\
    \ See [**Using Main Image Files**](#importing-custom-data-flows).                                \
    \                                                                                                \
    \                                                        |\n| `template:<flowID>:<fieldSlug>` | Optional\
    \ | You can also specify custom extension data in the CSV by specifying the flow `ID` or `slug` and\
    \ the field `name`. For example, `template:<flowSlug>:<fieldName>` format. See [**Importing Custom\
    \ Data (Flows)**](#importing-custom-data-flows). |"
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
