- aid: elastic-path:elastic-path-proration-policies-api
  name: Elastic Path Proration Policies API
  description: "Proration is the adjustment of charges or credits on a subscriber's account based on the\
    \ amount of time a service is used. Proration ensures that subscribers are only charged for the actual\
    \ time they use the service, whether they upgrade, downgrade, start, or cancel their subscription\
    \ partway through a billing cycle. This means fair billing for your subscribers and provides you with\
    \ the flexibility to change your subscribers subscriptions at any time. \n\n::: note\n\nSubscriptions\
    \ use client credentials to enable changes to subscriptions, so if you want your shoppers to have\
    \ the ability to make changes, you can implement a BFF layer using this approach.\n\n:::\n\nProration\
    \ occurs for:\n\n- Pricing option upgrades/downgrades:  If a subscriber changes their pricing option\
    \ in the middle of a billing cycle, proration adjusts the charges to reflect the time spent on each\
    \ pricing option.\n- Service cancellation: If a subscriber cancels a subscription before the end of\
    \ a billing cycle, they may receive a prorated invoice for the used portion of the subscription.\n\
    - Mid-cycle subscription: If a subscriber starts a subscription in the middle of a billing cycle,\
    \ they are charged a prorated amount for the remaining days in the billing cycle.\n\nThere are several\
    \ scenarios when implementing proration policies.\n\n1. You may want one policy for multiple offerings\
    \ because only some subscriptions need prorating.\n2. You may want a default proration policy for\
    \ your store.\n3. You may want several policies for different offerings. \n\nIn Subscriptions, charges\
    \ only prorate by day. As soon as a subscriber changes their subscription, a manual billing run is\
    \ triggered and an invoice is generated with the new price on the next billing run and the difference\
    \ in price is prorated over days.  \n\nBy default, proration is not enabled for Subscriptions. Once\
    \ you have attached a proration policy to an offering, proration is enabled automatically.\n\n###\
    \ End dates when switching pricing options\n\nSubscriptions manages the subscription end date when\
    \ shoppers switch from one pricing option to another. Whether or not an end date is configured depends\
    \ on the end behavior of the pricing options you are switching between.\n\n| Current Subscription\
    \ | New Subscription | Proration Behavior | End date |\n| --- | --- | --- | --- |\n| `close` | `roll`\
    \ | The subscription switches from a pricing option with a fixed end date to a rolling pricing option\
    \ so no end date is set after proration. | No end date is configured. |\n| `roll` | `close` | The\
    \ subscription switches to a fixed pricing option, and the end date is configured based on the duration\
    \ of the pricing option. | An end date is configured. |\n| `close` | `close` | The remaining time\
    \ on the current pricing option is not carried over to the new pricing option. For example, if your\
    \ current pricing option has 3 months remaining and you switch to a new pricing option that has a\
    \ fixed length of 6 months, the new end date is calculated as 6 months from the day you switch pricing\
    \ options, effectively resetting the subscription length to the new pricing option. | New end date\
    \ calculated from the day you switched pricing option. |"
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Proration Policies
  properties:
  - type: OpenAPI
    url: openapi/elastic-path-proration-policies-api-openapi.yml
  - type: Documentation
    url: https://developer.elasticpath.com/api
- aid: elastic-path:elastic-path-releases-api
  name: Elastic Path Releases API
  description: >-
    When a catalog is published, a catalog release is created. A catalog release provides a snapshot of
    the product information taken at the time of publication. You can have one or more catalog releases
    available in your organization or in your store. If you publish a catalog for your organization, the
    catalog is available when the store is launched.


    If you have more than one catalog published for your store, use catalog rules to specify when to display
    each catalog. For example, you can use [**catalog rules**](/docs/api/pxm/catalog/rules) to schedule
    a catalog to appear during a particular date and time, such as a seasonal catalog. The catalog may
    have different pricing than the other catalogs.


    When a catalog is ready to be used in a store, you publish it. You can create and publish catalogs
    for different contexts and channels.


    Here are some pointers to understand a catalogs' lifecycle.


    - The default catalog is always the oldest published catalog and must have have at least one release.

    - At any time, the most recent three catalog releases are maintained. Hence, if there is a fourth
    catalog release, the first catalog release is automatically removed.

    - Until the catalog is published again, the previously created three catalog releases stay permanently.

    - If you want any other catalog to become the default catalog, you must create a catalog rule.

    - If you want the oldest published catalog to become the default catalog, you must remove the catalog
    rule.

    - Use the `sort_order` value in the `variations` to program your storefront to display the variation
    options in the order that you want.


    Here is a diagram that describes a catalogs' lifecycle:


    ![Catalogs' Lifecycle](/assets/catalog-lifecycle.png)


    ### Publishing catalogs


    When you publish a catalog, the `live` products in the hierarchies appear in a catalog release. A
    catalog release provides a snapshot of product information taken at the time of publication. You can
    have one or more catalog releases available in your organization or in your store. If you publish
    a catalog for your organization, the catalog is available when the store is launched.


    If you have more than one catalog published for your store, use catalog rules to specify when to display
    each catalog. For example, you can use [catalog rules](/docs/api/pxm/catalog/rules) to schedule a
    catalog to appear during a particular date and time, such as a seasonal catalog. The catalog may have
    different pricing than the other catalogs. You can have multiple published catalogs.


    When a catalog is ready to be used in a store, you publish it. You can create and publish catalogs
    for different contexts and channels. You can see the differences between the last two consecutive
    catalog releases. See [Publish a catalog](/docs/api/pxm/catalog/publish-release).


    You retrieve catalogs for your shopper experience by using the [Catalog View API](/docs/api/pxm/catalog/releases).
