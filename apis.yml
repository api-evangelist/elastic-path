- aid: elastic-path:elastic-path-flows-api
  name: Elastic Path Flows API
  description: "### Flows in Commerce\n\nThere are two scenarios for using flows:\n\n- Extend an existing\
    \ resource, such as customers and orders.\n- Create a new resource, such as a blog, wishlist, or customer\
    \ review.\n\n#### Extend an existing resource\n\nThe most common usage of the Flows API is to extend\
    \ existing resources, such as `customers` and `orders`. These types of resources are called core flows\
    \ and are handled differently than non-core flows. See [**Core and non-core flows**](#core-and-non-core-flows).\n\
    \nFor example, you can extend the `customer` resource to store custom data, such as a `user_profile`\
    \ field for customers. Or you might want to add an `age` field to store a customer's age.\n\nExtending\
    \ a resource applies only to core flows. When creating a new flow, make sure the `slug` matches that\
    \ of a core resource listed in the following table.\n\n| Flow slug                               \
    \    | Description                    | Availability Level |\n|:--------------------------------------------|:-------------------------------|\
    \ :---|\n| `accounts`                                  | Extend the [`account`](/docs/api/accounts/account-management-introduction)\
    \ object. | Store |\n| `account-members`                           | Extend the [`account-members`](/docs/api/accounts/account-members)\
    \ object. | Store |\n| `account-memberships`                       | Extend the [`account-membership`](/docs/api/accounts/account-membership)\
    \ object. | Store |\n| `addresses`                                 | Extend the [`address`](/docs/api/addresses/account-addresses)\
    \ object. | Store |\n| `authentication-realms`                     | Extend the [`authentication-realms`](/docs/api/single-sign-on/authentication-realms)\
    \ object. | Store |\n| `carts`                                     | Extend the [`carts`](/docs/api/carts/carts-checkout-orders-introduction)\
    \ object. | Organization/Store |\n| `cart_items`                                | Extend the [`cart_item`](/docs/api/carts/cart-items)\
    \ object. | Organization/Store |\n| `customers`                                 | Extend the [`customer`](/docs/customer-management/customer-management-api/customer-management-api-overview)\
    \ object. **Note**: Please use Account Management for all new frontend experiences.  | n/a |\n| `oidc-profiles`\
    \                             | Extend the [`oidc-profiles`](/docs/api/single-sign-on/oidc-profiles)\
    \ object. | Store |\n| `order_items`                               | Extend the [`order_item`](/docs/api/carts/get-order-items)\
    \ object. | Organization/Store |\n| `orders`                                    | Extend the [`order`](/docs/api/carts/orders)\
    \ object. | Organization/Store |\n| `password-profiles`                         | Extend the [`password-profiles`](/docs/api/single-sign-on/password-profiles)\
    \ object. | Store |\n| `products`                                  | Extend the [`product`](/docs/api/pxm/products/products)\
    \ object. | Store |\n| `promotions`                                | Extend the [`promotion`](/docs/api/promotions/promotions-standard-introduction)\
    \ object. | Store |\n| `rule-promotions`                           | Extend the [`rule-promotion`](/docs/api/promotions-builder/create-rule-promotion)\
    \ object. | Store |\n| `user-authentication-info`                  | Extend the [`user-authentication-info`](/docs/api/single-sign-on/user-authentication-infos)\
    \ object. | Store |\n| `user-authentication-oidc-profile-info`     | Extend the [`user-authentication-oidc-profile-info`](/docs/api/single-sign-on/user-authentication-oidc-profile-infos)\
    \ object. | Store |\n| `user-authentication-password-profile-info` | Extend the [`user-authentication-password-profile-info`](/docs/api/single-sign-on/user-authentication-password-profile-infos)\
    \ object. | Store |\n| `catalogs`                                  | Extend the [`catalog`](/docs/api/pxm/catalog/catalogs)\
    \ object. It will not extend the [`catalog-release`](/docs/api/pxm/catalog/releases) object. | Store\
    \ |\n\n#### Create a new resource\n\nYou can create new resources to support product reviews, wish\
    \ lists, blog articles, staff profile pages, and many more. These non-core flows are referred to as\
    \ custom flows. See [**Core and non-core flows**](#core-and-non-core-flows).\n\n:::note\n\n[Custom\
    \ APIs](/docs/api/commerce-extensions/custom-ap-is#custom-apis-vs-non-core-flows) are the next generation\
    \ of Non-Core Flows. Flows are not going anywhere, but Custom APIs offer enhanced capabilities. We\
    \ recommend using Custom APIs for any of your new use cases.\n\n:::\n\n#### Core and non-core flows\n\
    \nThe following table describes the differences between core and non-core flows:\n\n| Core Flows \
    \                                                   | Non-core Flows |\n|:--------------------------------------------------------------|:-------------|\n\
    | Extend an existing resource.                                  | Create a new resource. |\n| Entries\
    \ managed automatically by Commerce. | Create and manage entries manually. |\n| Requests are sent\
    \ to the `fields` endpoint.                   | Requests are sent to the `entries` endpoint. |\n\n\
    :::caution\n\nYou cannot delete core flows after creating them with the API or Commerce Manager.\n\
    \n:::\n\n#### Flows taxonomy\n\nFields and entries are an integral part of flows. A flow describes\
    \ a collection of fields. A field represents a single field of data. An entry is a specific instance\
    \ of a flow, and is associated with a specific instance of an entity, such as a single customer. Entries\
    \ for core flows (existing resources) are managed automatically for you.\n\nIn database terms, you\
    \ can think of flows as tables, fields as columns, and entries as database records.\n\n### Templates\
    \ in Product Experience Manager\n\nTemplates allow you to attach a specific set of attributes to your\
    \ products.\n\n- You can use templates to define characteristics of your products.\n- You can use\
    \ templates for Search Engine Optimization (SEO).\n\n#### Template Taxonomy\n\nAttributes and entries\
    \ are integral to templates. A template describes a collection of attributes. An attribute represents\
    \ a single characteristic, like color. An entry is a specific instance of an attribute, for example,\
    \ blue, and is associated with a specific product.\n\n  A template is exactly the same as a flow except\
    \ it has a different naming convention. The name of a template is in the format **products(*slug*)**\
    \ where *slug* is the slug of a template.\n\n#### Associating templates with products\n\n  Once you\
    \ have created your template, and [**associated**](/docs/api/flows/create-an-entry-relationship) the\
    \ temp with a product in Product Experience Manager, it becomes a template. \n\n  For example, if\
    \ you create a template with a slug of `SizeGuide` then the template name is **products(SizeGuide)**.\
    \ You can then [**associate**](/docs/api/flows/create-an-entry-relationship) this template to all\
    \ clothing products in your store and the slug is included in all the responses that contain products.\n\
    \n   You can create product templates for both organization and store. In addition, stores can use\
    \ organization templates for store-level products.\n\n  For more information about adding attributes,\
    \ see [**Fields**](/docs/api/flows/fields)."
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
