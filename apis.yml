- aid: elastic-path:elastic-path-catalogs-api
  name: Elastic Path Catalogs API
  description: >-
    A catalog contains the products available for sale either in your organization or store. A catalog
    also contains information about how to organize those products for navigation menus and search facets
    in a shopper experience.


    Before you create a catalog you must define the following resources:


    - Hierarchies: hierarchies and nodes to categorize the products. See [**Hierarchies**](/docs/api/pxm/products/hierarchies).

    - Products: product information, associated assets, and links to hierarchy nodes. See [**Products**](/docs/api/pxm/products/products).

    - Price Books: prices for the products associated with the hierarchies. See [**Price Books**](/docs/api/pxm/pricebooks).


    A catalog is a combination of hierarchies and a price book.


    ### Products


    Commerce automatically assigns types to the products you create. Product types can be used in catalogs.
    For example, in your catalog, you can filter on `parent` so that only your parent products are displayed
    in your storefront.


    You can use product tags to store or assign a key word against a product or service that you sell
    in your store. The product tag can then be used to describe or label that product. Product tags represent
    similarities between products who do not share the same attributes. Using product tags means that
    you can group your products together, for example, by brand, category, subcategory, colors, types,
    industries, and so on. Product tags can be used in catalogs. For example, you can categorize your
    products based on color. Your shoppers can then search your products by color, enabling shoppers to
    quickly find what they are looking for, increasing the likelihood of a purchase, and boosting conversion
    rates.


    ### Hierarchies


    The hierarchies determine which products appear in the catalog, that is, only the products that are
    associated with the selected hierarchies are included in the catalog. You can also specify the order
    you want your hierarchies to display in a published catalog. You can order your hierarchies on a catalog-by-catalog
    basis.


    ![Hierarchy_sorting](/assets/hierarchy_sorting.png)


    For more information, see [**create a Catalog**](/docs/api/pxm/catalog/create-catalog).


    #### Understanding How Products And Nodes Are Associated


    You can use `breadcrumb` metadata to understand how products and nodes are associated. it explains
    how products are associated with parent nodes and the relationship among the array of nodes. This
    is useful if you want to improve how your shoppers search within your store.


    The `breadcrumb` information that you get in an endpoint response depends on whether the endpoint
    is retrieving product or node details.


    |  Object |  Product/Node |  Description |

    | --- | --- | --- |

    | `breadcrumb` | Node | A list of nodes that a product is associated with. Up to 10 levels of nodes
    are displayed, depending on the number of levels of nodes you have. |

    | `bread_crumbs` | Product | The relationship among the array of nodes a product is associated with,
    demonstrating the linking of the children nodes with the parent nodes. Up to 10 levels of nodes are
    displayed, depending on the number of levels of nodes you have. |

    | `bread_crumb_nodes` | Product | An array of parent node IDs that a product is associated with. The
    `bread_crumb_node` metadata lists up to 10 levels of parent nodes, depending on the number of levels
    of parent nodes you have. |


    #### Understanding `bread_crumbs` Metadata


    The following diagram illustrates a parent and child nodes.


    ![Breadcrumbs](/assets/breadcrumbs.PNG)


    1. The product is in **Node 2**. The ID for **Node 2** is shown first in the first set of breadcrumbs.

    1. **Node 2** is part of **Hierarchy 1**. The ID for **Hierarchy 1** is shown second.

    1. **Node 1** is the parent node of **Node 2**. The ID for **Node 1** is shown last.

    1. The product is also in **Node 3**. The ID for **Node 3** is shown first in the second set of breadcrumbs.

    1. **Node 3** is in the root of **Hierarchy 1**. The ID for **Hierarchy 1** is shown last.


    In the `bread_crumb_nodes` metadata, you can see a list of parent nodes a product is associated with.


    If you subsequently add a product to a new node, then the `bread_crumb_nodes` metadata appends the
    new node to the top of the list. Using the example above, if we add the product to **Node 1**:


    1. The `bread_crumb_nodes` metadata is generated to show the new node appended to the top of the list.

    1. The `bread_crumbs` metadata is updated with the new node.


    #### Understanding Breadcrumb Metadata for Child Products


    When a catalog is published, the breadcrumb information for a child product includes the metadata
    mentioned for the parent product, in addition to the information specific to the child product. For
    example, **Product A** is the parent product, associated with **Node 1** and **Node 2**. The metadata
    for child **Product B** includes **Node 1** and **Node 2**, in addition to its own metadata information.


    ### Nodes


    The nodes determine which products appear under this in the catalog, that is, only the products that
    are associated with the selected node are shown under this node.


    ### Price books


    A price book contains the prices for each of the products in the catalog. You can create multiple
    price books for different scenarios, such as seasonal sales, business versus retail customer pricing,
    and reward programs. When creating a catalog, you can specify up to five price books. You must set
    a priority for your price books. Product prices are displayed in the catalog according to the priority
    of the price books. See [Create a catalog](/docs/api/pxm/catalog/create-catalog).
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Catalogs
  properties:
  - type: OpenAPI
    url: openapi/elastic-path-catalogs-api-openapi.yml
  - type: Documentation
    url: https://developer.elasticpath.com/api
- aid: elastic-path:elastic-path-checkout-api
  name: Elastic Path Checkout API
  description: >-
    The checkout workflow ties together many of the key concepts covered in this section. When a customer
    initiates the checkout process, an order is created from the cart. The order is incomplete until after
    a successful payment is made. A complete order can be shipped and the product deducted from inventory
    counts.


    ![Checkout workflow](/assets/checkout-flow.png)


    ### Summary of the checkout workflow


    1. Add a product to a cart. A cart and its reference number is generated.

    2. Manage the cart items. For example, you might add items, remove items, and change quantities.

    3. Check out the cart. An incomplete order is created.

    4. Pay for an order: provide billing and shipping details, if you are a new customer. The order is
    now in the processing status.

    5. If using a manual gateway, after you authorize and capture it, Composable Commerce considers the
    order complete. If you use a third-party integration supported by Composable Commerce (such as Stripe),
    after the third-party gateway authorizes and captures the payment, the order becomes complete. Usually
    capture does not occur at the same time as authorization. For more information, see the Capture section.

    6. After the order is shipped, you can manually flag it as fulfilled.


    ### Carts


    When a product is added to a cart, a cart is generated together with its unique reference ID that
    on checkout becomes a part of the order ID. If you are using our JavaScript software development kit,
    generating a cart reference ID is done for you; otherwise, add a cart reference generator to your
    functionality.


    ### Promotions and custom items


    Optionally, apply a promotion code on a cart, or add custom_items to modify the product price (typically
    to handle taxes, customs, or shipping).


    ### Checkout


    You can checkout a cart with an associated customer name and email (customer object). Typically, this
    would be used for new customers or ones that prefer to shop as guests. Use the `customer.id` checkout
    option to checkout for an existing customer. After a successful checkout is completed, the response
    contains an order.


    Email addresses that either begin or end with a period, or contain consecutive periods, are considered
    invalid, resulting in the following error:

    ```json

    "errors": [
      {
          "status": 400,
          "source": "data.customer.email",
          "title": "format",
          "detail": "Does not match format 'email'"
      }
    ]
      ```

    ### Payments


    On checkout, an incomplete order is created. You can then use a third-party integration to handle
    your payment gateway. If the payment gateway is supported by Composable Commerce, such as Stripe,
    the payment is processed externally but handled internally. When a successful validation is returned,
    Composable Commerce flags the order as complete.


    If you are using a payment method not officially supported by Composable Commerce, the gateway needs
    to be implemented and handled manually. After the payment has been authorized and captured either
    through Commerce Manager or API, the status of an order becomes complete.


    ### Shipping


    The status of an order and the status of shipping are handled separately, and so an order can be complete
    but not shipped. Orders that have not been shipped yet have a status of unfulfilled. This flag is
    generated automatically by Composable Commerce when an order is created. Currently, you can only update
    the shipping status manually, through the API. After the order is shipped, flag its shipping status
    as fulfilled.


    ### Inventory


    If enabled, you can manage your stock. As such, your stock is automatically updated as soon as a product
    is checked out.
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Checkout
  properties:
  - type: OpenAPI
    url: openapi/elastic-path-checkout-api-openapi.yml
  - type: Documentation
    url: https://developer.elasticpath.com/api
