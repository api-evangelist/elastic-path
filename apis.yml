  description: >-
    An authentication realm is a container that consists of the following:

      - Users -  Represented by [User Authentication Info](/docs/api/single-sign-on/user-authentication-infos)
    objects
      - Authentication profiles - Ways for the users to authenticate, such as one or more [OpenID Connect
    Profiles](/docs/api/single-sign-on/oidc-profiles) or [Password Profiles](/docs/api/single-sign-on/password-profiles)
      - Mappings between users and authentication profiles - [User Authentication OpenID Connect Profile
    Info](/docs/api/single-sign-on/user-authentication-oidc-profile-infos) or [User Authentication Password
    Profile Infos](/docs/api/single-sign-on/user-authentication-password-profile-infos)

    Here's a domain diagram showing these relationships

    ![authentication realm](/assets/authentication-realm-domain.png)


    Composable Commerce comes with three per-store pre-set realms:
      - Buyer Organization. For customers: users who buy products from your store.
      - Merchant Organization. For administrators: users who log in to Commerce Manager to modify the
    store’s settings or catalog.
      - Account Management Realm. For account members: users who buy products from your store on behalf
    of accounts. Password profiles are only available for account management realm.
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
