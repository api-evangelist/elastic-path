- aid: elastic-path:elastic-path-promotion-codes-api
  name: Elastic Path Promotion Codes API
  description: >-
    You can apply promotions automatically to all customer carts, or you can create promotion codes that
    customers must enter to receive the discount. You can enable this feature by setting the automatic
    attribute to `false` in the promotions schema when you create a promotion. For more information, see
    [Create Promotion Codes](/docs/api/promotions/create-promotion-codes).


    You can generate and export codes for a promotion using the bulk code generation feature, which allows
    you to create a large number of unique codes and export them in CSV format. For details, refer to
    the [Generating Bulk Codes](/docs/commerce-manager/promotions-standard/overview#generating-bulk-codes)
    and [Managing Export Codes](/docs/commerce-manager/promotions-standard/overview#managing-code-export)
    sections.


    You can generate a maximum of 1000 codes for a promotion. If you need to generate more than 1000 codes,
    limit the promotion's duration to a maximum of 365 days from its start date. The promotion expiry
    date is 365 days.


    With the consume unit feature, you can limit the number of usages of a code for a promotion. You must
    create a code for this promotion to track the usage of the promotion. The consume unit options are
    `per_cart` and `per_item`. For example, consider a store that offers 50% off on *SKU1*, but limits
    the promotion to a maximum of two usages. Under the `per_cart` setting, a shopper can buy *SKU1* twice
    in a separate transaction, each at a 50% discount. However, with the `per_item` setting, if a shopper
    buys two SKU1s in a single purchase, both items count toward the promotion's usage limit. Therefore,
    the shopper would use up both usages of the promotion in a single purchase.


    Promotion codes can be group codes or individual codes. For example, you can offer a seasonal discount
    to all customers, such as *SUMMER-SALE*, or you can offer preferred customers unique discount codes.
    Promotion codes expire automatically at the end of the promotion period and are removed from the promotion.


    When a promotion expires, the promotion codes attached to the promotion automatically become invalid.
    However, when you re-enable the expired promotion, the promotion codes attached to the promotion are
    deleted.


    When you checkout a cart with an expired promotion, the expired promotion will be automatically removed
    from a cart and the checkout process is initiated. As a best practice, we recommend to update your
    cart to remove the expired promotion before initiating the checkout process.


    When extending the end date of an expired promotion with over 1000 codes, you will receive an error
    response. See [Update a Promotion](/docs/api/promotions/update-a-promotion). In such cases, we recommend
    [duplicating the promotion](/docs/commerce-manager/promotions-standard/overview#duplicating-promotions),
    allowing you to set the new end dates and create promotion codes as needed.
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Promotion Codes
  properties:
  - type: OpenAPI
    url: openapi/elastic-path-promotion-codes-api-openapi.yml
  - type: Documentation
    url: https://developer.elasticpath.com/api
- aid: elastic-path:elastic-path-promotion-jobs-api
  name: Elastic Path Promotion Jobs API
  description: >-
    Use Jobs API to initiate a job within a promotion. Jobs operate asynchronously and have a different
    status based on their progress. The following are the job statuses:


    - `pending`: Commerce has received the request but is currently busy processing other requests.

    - `processing`: Commerce has initiated processing the job.

    - `completed`: The job is successfully completed.

    - `failed`: The job has failed.

    - `cancelling`: The job is currently in the process of being canceled. You need to wait for the cancellation
    process to complete. This occurs prior to the `cancelled` status. For example, if you cancel a big
    `code_generate` job, it may take some time for the cancellation to complete since part of the cancellation
    process involves deleting the generated codes.

    - `cancelled` : The job request is canceled.


    ![Promotion Job Statuses Workflow](/assets/job_status_workflow.png)


    ### Characteristics of Jobs


    - You can only initiate one job at a time within a promotion. If you want to run another job for the
    same promotion, you must wait until the previous job is `completed` or `failed`. However, you can
    create new jobs for different promotions even if there are `pending` jobs in other promotions.

    - If you intend to manage promotions with more than 10,000 codes per promotion, we recommend [exporting
    codes](/docs/api/promotions/create-a-promotion-job) for viewing purposes instead of attempting to
    view them within Commerce Manager. This recommendation is made due to our enforced maximum page offset
    limit of 10,000. Altering the page_offset_limit value poses potential performance risks to the platform.

    - A `code_generate` job is initiated even if the maximum allowable number of codes for the promotion
    has been reached. However, when processed, this job will fail. To view the status of this failed job,
    you can only do so by passing [GET Jobs](/docs/api/promotions/get-promotion-jobs) request.

    - A limited number of jobs can be processed at a time. Jobs are queued and processed sequentially,
    one after the other. You can expect a certain delay before job processing.
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Promotion Jobs
