- aid: elastic-path:elastic-path-user-authentication-infos-api
  name: Elastic Path User Authentication Infos API
  description: >-
    A `user-authentication-info` represents a user. This object contains information, such as the name
    and email address, and has sub-resources for each mechanism that the user can use to log in./single-sign-on/authentication-realm-api/authentication-realm-api-overview)
    and the user is configured to authenticate through that profile, then the `user-authentication-info`
    object is associated with a [User Authentication OpenID Connect Profile Info](/docs/api/single-sign-on/user-authentication-oidc-profile-infos)
    subresource.


    [Account Members](/docs/api/accounts/get-v-2-account-members-account-member-id) reference User Authentication
    Infos directly (i.e., for every account member there is an user authentication info with the same
    id) and the User Authentication Info API is how you manage and configure the authentication options
    for that user.


    [Customers (that login via OIDC)](/docs/customer-management/customer-management-api/get-a-customer)
    also use the User Authentication Info.
