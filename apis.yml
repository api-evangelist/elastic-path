- aid: elastic-path:elastic-path-custom-discounts-api
  name: Elastic Path Custom Discounts API
  description: >-
    With custom discounts, you can allow your shoppers to apply discounts from external services to their
    purchases. To apply custom discounts to carts and cart items, you need to set `custom_discounts_enabled`
    field to `true` in your [Cart Settings](/docs/api/carts/put-v-2-settings-cart).


    You cannot add custom discounts to an empty cart.


    :::caution


    - You can apply up to five custom discounts to cart and cart item.

    - The stores that use [simple calculation method](/guides/How-To/Carts/calculate-totals) do not support
    custom discounts.


