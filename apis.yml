- aid: elastic-path:elastic-path-account-cart-associations-api
  name: Elastic Path Account Cart Associations API
  description: >-
    You can create associations between an account and one or more carts. After cart associations exist
    for an account, those carts are accessible across any device. You can delete associations as required.


    There are two ways to access the cart: with an [Account Management Authentication Tokens](/docs/api/accounts/post-v-2-account-members-tokens)
    and without one.


    ### With an `Account Management Authentication` token


    These endpoints are for users who authenticated implicitly and require an Account Management Authentication
    token in the header to access the account cart associations APIs. For more information, see the [Account
    Token](/docs/api/accounts/post-v-2-account-members-tokens) documentation.


    #### Cart creation


    Shoppers create carts and can use any of the carts that they created to check out an order.


    :::note


    You can create a cart id, name, and description for the cart. The cart requires a name. Ensure that
    the string length is greater than or equal to one. Use any symbol in the name and description. For
    cart id, ensure that you follow the guidelines for safe characters. For more information about cart
    id naming requirements, see [Safe Characters](/guides/Getting-Started/safe-characters).


    :::


    ### Without an `Account Management Authentication` token


    These endpoints are for users who use the Client Credentials Token and do not require an account management
    authentication token in the header to access the account cart associations APIs. For more information,
    see the [Authentication](/docs/authentication/security) documentation.


    This user acts as a system administrator and can call any account cart association operations for
    any account and cart.


    ### Error Codes


    You might encounter the following response codes, depending on the scenario:


    * `400` - `The type does not exist or is not listed as account` - Ensure that the type is `account`
    and is present.


    * `403` - `Cannot associate more than one account`.


    * `403` - `Account does not have the required permissions to fulfill this request`.


    * `403` - `Invalid json payload` - Check JSON input. The request body must be an array `[]`. If the
    request body is an object, the error is generated.
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Account Cart Associations
  properties:
  - type: OpenAPI
    url: openapi/elastic-path-account-cart-associations-api-openapi.yml
