- aid: elastic-path:elastic-path-hierarchies-api
  name: Elastic Path Hierarchies API
  description: >-
    ```mdx-code-block

    import HierarchyOverview from '/docs/partials/pxm/hierarchies/hierarchies.mdx';

    import HierarchyCatalog from '/docs/partials/pxm/hierarchies/hierarchycatalogs.mdx';


    <HierarchyOverview />


    ## Creating Hierarchies and Nodes


    You can create the **Major Appliances** hierarchy by performing the following steps.


    1. Using [**Create a Hierarchy**](/docs/api/pxm/products/create-hierarchy), create a hierarchy whose
    name is **Major Appliances**. Each hierarchy has a hierarchy ID. In other words, the hierarchy ID
    is the ID of the root node.

    1. Using [**Create a Node in a hierarchy**](/docs/api/pxm/products/create-node), create the following
    child nodes. When you create a node in a hierarchy, by default, the node is a child of the root node.
    Specify `sort_order` to configure the order of the nodes.
       - **Ranges**
       - **Refrigerators**
       - **Dishwashers**
    1. Using [**Create a Node in a hierarchy**](/docs/api/pxm/products/create-node), create the **Electric
    Ranges** node, specifying **Ranges** as the parent node.

    1. Using [**Create a Node in a hierarchy**](/docs/api/pxm/products/create-node), create the following
    nodes, specifying **Electric Ranges** as the parent node.
       - **Electric Ranges 24ˮ**
       - **Electric Ranges 30ˮ**
       - **Double Oven**
    1. Using [**Create a Node in a hierarchy**](/docs/api/pxm/products/create-node), create the **Gas
    Ranges** node, specifying **Ranges** as the parent node.

    1. Using [**Create a Node in a hierarchy**](/docs/api/pxm/products/create-node), create the following
    nodes, specifying **Gas Ranges** as the parent node.
       - **Gas Ranges 24ˮ**
       - **Gas Ranges 30ˮ**
       - **Gas Ranges 32"**
       - **Double Oven**
    1. Using [**Create a Node in a hierarchy**](/docs/api/pxm/products/create-node), create the following
    nodes, specifying **Dishwashers** as the parent node.
        - **Built-in**
        - **Standalone**

    ## Hierarchies and Catalogs


    <HierarchyCatalog />


    ```
