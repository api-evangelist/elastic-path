- aid: elastic-path:elastic-path-features-api
  name: Elastic Path Features API
  description: >-
    A feature indicates some benefit that is received as a result of having an active subscription. This
    translates to tags being applied to the subscriber's account allowing access to some resource to be
    controlled.


    There are three types of feature - `access`, `promotion`, and `usage`.


    The `access` feature is designed to simply give access to some resource, for example a streaming service.
    If its tag is present on the subscriber's account then access to that resource should be provided.


    The `promotion` feature coupled with the [promotions service](/docs/promotions-builder/overview) allows
    subscribers to get access to a specific promotion. This is achieved using a tag which is used as a
    constraint on the promotion. A promotion feature may have multiple promotions associated with it,
    but just one must be selected when configuring the feature for an offering's plan.

     The `usage` feature is designed to measure some sort of usage of a resource. This currently relies
    on [commerce extensions](/docs/api/commerce-extensions/commerce-extensions-introduction) to manage
    usage.

     Once defined a feature may be attached to an offering, making it available for use with any of that
    offering's plans. Once attached it must be configured for each of the offering's plans it is applicable
    to. For the `promotion` feature this involves specifying which of that feature's tags, and hence which
    promotion, should be applied when subscribed to that offering. Similarly, for the `promotion` feature
    the default value for the usage metric must be supplied.
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Features
  properties:
  - type: OpenAPI
    url: openapi/elastic-path-features-api-openapi.yml
  - type: Documentation
    url: https://developer.elasticpath.com/api
- aid: elastic-path:elastic-path-fields-api
  name: Elastic Path Fields API
  description: "With fields, you can:\n\n- in Commerce, use a field in your flows to represent  single\
    \ field of data (for example a `Product Rating`) to be applied to an entity\n- in Product Experience\
    \ Manager, use an attribute in your template to attach a characteristic like `color` to a product.\n\
    \nA field/attribute represents a single piece of data. All fields/attributes have a `field_type` (`string`,\
    \ `integer`, `boolean`, `date` or `relationship`), a default value, and an optional set of validation\
    \ rules.\n\n:::caution\n\n- Custom names and values prefixed with `$` are not supported.\n- There\
    \ is a hard limit of 100 fields per flow.\n- You can configure default values for fields. If you choose\
    \ to do so, you must ensure that your default field values comply with your validation rules.\n\n\
    :::\n\n#### Field/Attribute Validation Rules\n\nWhen creating a field/attribute, you can add validation\
    \ to the values that are stored. The validation you use depends on the `field_type` of the field/attribute.\
    \ Each validation rule is expressed as a validation rule object.\n\n#### `string` / `enum`\n\nMust\
    \ be one of a predefined collection of strings. If you leave the field blank or enter an incorrect\
    \ value then an `Invalid Value` error is displayed. \n\n| Attribute | Type | Description |\n| :---\
    \ | :--- | :--- |\n| `type` | `string` | `enum` |\n| `options` | `array[string]` | An array of valid\
    \ string values. |\n\n##### `string` / `email`\n\nMust be a valid email address.\n\n| Attribute |\
    \ Type | Description |\n| :--- | :--- | :--- |\n| `type` | `string` | `email` |\n\n##### `string`\
    \ / `slug`\n\nCan contain only letters, numbers, hyphens and underscores.\n\n| Attribute | Type |\
    \ Description |\n| :--- | :--- | :--- |\n| `type` | `string` | `slug` |\n\n##### `integer` / `between`\n\
    \nMust be between the two provided values.\n\n| Attribute | Type | Description |\n| :--- | :--- |\
    \ :--- |\n| `type` | `string` | `enum` |\n| `options` | `object` | An object containing `from` and\
    \ `to` integers. |\n\n##### `integer` / `enum`\n\nMust be one of a predefined collection of integers.\n\
    \n| Attribute | Type | Description |\n| :--- | :--- | :--- |\n| `type` | `string` | `enum` |\n| `options`\
    \ | `array[integer]` | An array of valid integer values. |\n\n##### `float` / `between`\n\nMust be\
    \ between the two provided values.\n\n| Attribute | Type | Description |\n| :--- | :--- | :--- |\n\
    | `type` | `string` | `enum` |\n| `options` | `object` | An object containing `from` and `to` floats.\
    \ |\n\n##### `float` / `enum`\n\nMust be one of a predefined collection of floats.\n\n| Attribute\
    \ | Type | Description |\n| :--- | :--- | :--- |\n| `type` | `string` | `enum` |\n| `options` | `array[float]`\
    \ | An array of valid float values. |\n\n#### `date` / `enum`\n\nMust be one of a predefined collection\
    \ of dates.\n\n| Attribute | Type | Description |\n| :--- | :--- | :--- |\n| `type` | `string` | `enum`\
    \ |\n| `options` | `array[string]` | An array of valid date values as strings \\(`YYYY-MM-DD HH:MM:SS`\
    \ - time is optional\\). |\n\n##### `relationship` / `one-to-many`\n\n:::caution\nThis only applies\
    \ to Commerce. You cannot use relationships in Product Experience Manager templates.\n:::\n\nAllows\
    \ multiple relationships to be created.\n\n| Attribute | Type | Description |\n| :--- | :--- | :---\
    \ |\n| `type` | `string` | `one-to-many` |\n| `to` | `string` | The entity type you are making relationships\
    \ with in singular form (for example, `product`). |\n\n##### `relationship` / `one-to-one`\n\n:::caution\n\
    This only applies to Commerce. You cannot use relationships in Product Experience Manager templates.\n\
    :::\n\nAllows only a single relationships to be created on an entry.\n\n| Attribute | Type | Description\
    \ |\n| :--- | :--- | :--- |\n| `type` | `string` | `one-to-one` |\n| `to` | `string` | The entity\
    \ type you are making relationships with in singular form (for example, `customer`). |"
