- aid: elastic-path:elastic-path-price-book-modifiers-api
  name: Elastic Path Price Book Modifiers API
  description: >-
    You can use price modifiers to change the price property of child products. By default, child products
    inherit the same price as their base products. Using price modifiers, you can enable child products
    to inherit a different price. This enables you to configure the price of child products, for example,
    to be lower than its base product, without having to individually update the price of your child products.
    There are three types of price modifier.


    | Modifier          | Data Type | Effect                                       |

    |:------------------|:----------|:---------------------------------------------|

    | `price_increment` | `string`  | Increases the price of a product.            |

    | `price_decrement` | `string`  | Decreases the price of a product.            |

    | `price_equals`    | `string`  | Sets the price of a product to the amount you specify. |


    The following is an overview of the steps you need to follow to use price modifiers.


    1. Create a price modifier. You must give the price modifier a unique name. For more information,
    see [Create a Price Modifier](/docs/api/pxm/pricebooks/create-price-modifier).

    1. Build your child products with the new product modifier.
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Price Book Modifiers
  properties:
  - type: OpenAPI
    url: openapi/elastic-path-price-book-modifiers-api-openapi.yml
  - type: Documentation
    url: https://developer.elasticpath.com/api
- aid: elastic-path:elastic-path-price-books-api
  name: Elastic Path Price Books API
  description: "Price books contain prices for the products in your catalog. Each catalog must have one\
    \ price book. In your storefront, the product prices are displayed in the currency for the selected\
    \ locale. If a product in the catalog does not have a price in the price book, the product is displayed\
    \ without a price. \n\nA price book can be associated with multiple catalogs.\n\nFollowing on from\
    \ this, you can associate more than one price book with a catalog. Price book stacking allows you\
    \ to create multiple price books for different scenarios, such as seasonal sales, business versus\
    \ retail customer pricing, and reward programs. If you have multiple price books, when you create\
    \ a catalog, you must configure a priority for your price books. Product prices are displayed in the\
    \ catalog according to the priority of the price books. For example, you may have products that have\
    \ different prices based on region. You can have a price book with the standard retail pricing and\
    \ then have a second price book that has different pricing for a different region. See Create a catalog.\n\
    \nA price book contains a list of product SKUs and the prices you want to charge for those products.\
    \ If your store supports multiple locales, a price book can contain product prices in each of the\
    \ supported currencies. In addition, you can configure sales and volume (tier) pricing.\n\n:::note\n\
    \nPrice books work with products that are defined using the Product Experience Manager resource model.\
    \ If your products are defined using an earlier Products resource model, you will need to migrate\
    \ products to the `pcm/products` resource before you implement price books.\n\n:::\n\nYou can duplicate\
    \ an existing price book and create a new price book. All products and prices associated with the\
    \ price book are copied to the new price book. Based on the business requirements, you can use the\
    \ same data or update the data."
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Price Books
  properties:
  - type: OpenAPI
    url: openapi/elastic-path-price-books-api-openapi.yml
  - type: Documentation
    url: https://developer.elasticpath.com/api
- aid: elastic-path:elastic-path-prices-api
  name: Elastic Path Prices API
  description: "Price books contain prices for the products in your catalog. Use the Price Books API to\
    \ create price books and add product prices to the price book.\n\n### Volume (tiers) Pricing\n\nUsing\
    \ volume (tiers) pricing allows your store to offer different pricing for minimum quantities of items\
    \ that your customers purchase. When a customer adds sufficient quantity of an item and meets the\
    \ minimum required quantity for different pricing, all products with that item SKU are discounted\
    \ in the cart. You can define the price range for different quantities of different items as in the\
    \ following example:\n\n| Quantity | Price/Each |\n|:---------|:-----------|\n| 1-5      | $10.50\
    \     |\n| 6-10     | $10.00     |\n| 11-20    | $9.50      |\n| 21-50    | $8.50      |\n| 51+  \
    \    | $7.90      |\n\n### Sales Pricing\n\nWith sales pricing, a store can optionally add a sale\
    \ price to a product price. For example, a store can schedule seasonal pricing on products without\
    \ creating a new price book and catalog ruleset. Optionally, a store can schedule the date ranges\
    \ for the sale products. \n\nYou can set a sale price for an item within a bundle so that the product\
    \ is sold at the sale price when sold as part of the bundle. For example, if you have a bundle consisting\
    \ of four items, you can apply a discounted price to an item within the bundle to get a bundle sales\
    \ price. \n\n1. For sale prices in the same price book:\n\n    - the schedules must not be exactly\
    \ the same.\n    - schedules can partially overlap. If the schedule does contain overlapping sales\
    \ prices, the sale price of the smallest sale period is chosen.\n    - if you have just one sale price,\
    \ without a schedule, this is effectively a permanent price. If you want to add more sale prices to\
    \ the price book, you must configure a schedule for the sale price. \n\n2. Sale prices in different\
    \ price books can have overlapping schedules.\n\nBoth list and sale price (or was/is prices) are available\
    \ in the catalog response, enabling you to display slash pricing on your storefront, depending on\
    \ your requirements.\n\n### Creating a bundle sale price\n\nYou can assign a sale price to an option\
    \ in a bundle.\n\n1. In the product price book, create a sale.\n2. Specify the bundle ID that contains\
    \ the option you want to provide a sale price for.\n3. Provide the sale price for the option. You\
    \ can add the same sale price for the same option using an array of bundle_ids if you want to sell\
    \ the product as part of different bundles.\n\n### Understanding Volume and Sale Pricing Behavior\
    \ for Products\n\nIf you have configured both sale and volume pricing for your products and product\
    \ bundles, the following table describes how pricing behaves in the following scenarios.\n\n| Scenario\
    \ | Description |\n| --- | --- |\n| Minimum quantities for volume pricing and sale pricing | <ul><li>(With\
    \ sale schedule) If you have specified a minimum quantity of five whose price is $0.99 and at the\
    \ same time, you have configured a sale for the time of purchase, then when a shopper checks out with\
    \ 5 or more items, the total is based on the volume pricing. In other words, $0.99 × 5 = $4.95. Additionally,\
    \ if volume pricing exist for both the product price and the sale, the volume pricing for the sale\
    \ takes precedence. If no volume pricing is set in the sale, the base sale price is applied, and the\
    \ volume pricing for the product price will not be applied.</li><li>(With sale schedule) If a shopper's\
    \ items in the cart do not meet the minimum quantity required for volume pricing, the total is calculated\
    \ based on the sales price.</li><li>(Without sale schedule) If the sale is a permanent sale and volume\
    \ pricing is only set for the product price, then regardless of the quantity a shopper adds to a cart,\
    \ the final price is always calculated based on the base sales price. However, if volume pricing has\
    \ been set for the sale, the final price will be determined by the volume tier pricing set in the\
    \ sale, not the base sales price.</li></ul>\n| Two levels of volume pricing with different prices\
    \ for each volume. | If you have configured two levels of volume pricing, for example, the first minimum\
    \ quantity is 5 and the second minimum quantity is 10:<ul><li>When the quantity in the cart is =>\
    \ 5, then the price for the minimum quantity of 5 is used.</li><li>When the quantity in the cart is\
    \ => 10 then the price for the minimum quantity of 10 is used.</li></ul> |\n\n### Optimizing product\
    \ prices\n\nYou can add custom attributes to a product price, allowing your storefront to dynamically\
    \ use these attributes in it's pricing and display logic. This enables you to optimize your pricing\
    \ data, enhancing your ability to respond to market dynamics and customer preferences. Some examples\
    \ of pricing optimization strategies are:\n\n- dynamic pricing - allows you to change the price of\
    \ a product based on changes in customer demand, for example, raising prices during the high-demand\
    \ holiday season or segment-focused, like special offers for new customers.\n- value-based pricing\
    \ - allows you to offer different pricing tiers, for example, \"pro\" features cost more.\n- cost-plus\
    \ pricing - allows you to set prices by adding a specific percentage to the production cost of a single\
    \ unit.\n\nThere are two types of custom attributes:\n\n- `admin_attributes` - `admin_attributes`\
    \ are not displayed in catalogs. This means `admin-attributes` can only be viewed by administrators.\
    \ For example, you may want to add custom attributes that can automate price updates based on predefined\
    \ rules, saving time and reducing human error or you might want to integrate price attributes with\
    \ your other company systems, (ERP, CRM) ensuring consistency and accuracy across platforms.\n- `shopper_attributes`\
    \ - `shopper_attributes` are displayed in catalogs. This means `shopper_attributes` can be viewed\
    \ by both shoppers and administrators.  For example, you can set prices based on customer segments,\
    \ offering different prices for wholesale and retail customers or providing discounts to loyal customers.\
    \ \n\nBoth `admin-attributes` and `shopper_attributes` are structured as key-value pairs. Both the\
    \ keys and values are `strings`. You can have up to 100 keys for each type of attribute."
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Prices
  properties:
  - type: OpenAPI
    url: openapi/elastic-path-prices-api-openapi.yml
  - type: Documentation
    url: https://developer.elasticpath.com/api
- aid: elastic-path:elastic-path-product-export-api
  name: Elastic Path Product Export API
  description: "```mdx-code-block\nimport ProductExport from '/docs/partials/pxm/import/export.mdx';\n\
    \n<ProductExport />\n```\n\n### Characteristics of Exporting Products\n\n- Product exports are an\
    \ asynchronous operation. When you send a request to the Export API, it triggers an asynchronous job\
    \ to build the `.csv` file containing the product entries.\n- Jobs are processed one at a time. You\
    \ can continue to send product export requests, but those jobs are queued. In other words, Commerce\
    \ looks for any jobs that have a status of PENDING and starts the job with the earliest created date.\
    \ This process is repeated until all jobs are processed. See [**Jobs**](/docs/api/pxm/products/jobs).\n\
    - The Export API response includes a job resource. In the response, you can verify the job status;\
    \ if the status is successful, the response includes a link to the location where the `.csv` file\
    \ is stored. See [**Product Export CSV File**](#product-export-csv-file). A single CSV file contains\
    \ 10,000 rows, excluding the header. If you are exporting 50,000 products, the job endpoint response\
    \ contains links to five `.csv` files; each `.csv` file including 10,000 products.\n- You might have\
    \ specified custom extension data in a `.csv` file when you imported the products. These modifications\
    \ are all exported. So, when you send a request to the Export API, the `.csv` file, included in the\
    \ Job endpoint response, reflects any changes that you have made.\n- You cannot export product bundles.\n\
    \n### Product Export CSV File\n\nThe Product Export API generates a Comma Separated Values (CSV) file\
    \ that you can use to import/update products, main image files, and custom extension data. \n\nThe\
    \ `.csv` file is:\n\n - Comma-separated.\n - Header-based.\n   - Header attributes must be the same\
    \ as the product attributes.\n   - Header names can be in any order.\n - Each row after the first\
    \ line represents a single product.\n\nThe following table describes the headers that are supported.\n\
    \n| Header                           | Required | Description |                                  \
    \                           \n|:---------------------------------|:---------|:-----------------------------------------------------|\n\
    | id                               | Optional | A unique product ID that is generated when you create\
    \ the product. The `id` is used to look up products in the `.csv` file and matches them to the products\
    \ in your storefront that you want to update.                                                    |\n\
    | external_ref                     | Optional | A unique attribute associated with a product. This\
    \ could be an external reference from a separate company system, for example. The maximum length is\
    \ 2048 characters.  |                                                                            \
    \              \n| name                             | Required | The name of a product.     |    \
    \                                                                          \n| description       \
    \               | Required | A description for a product. You can include quotes in your product description,\
    \ if you want to emphasize a word, for example. To do this, put quotes around the product description.\
    \ For example, \"This product description describes my \"product\" and the product \"version\".\"\
    \ |\n| slug                             | Required | A label for the product that is used in the URL\
    \ paths. A slug can contain any combination of letters, numbers, periods, hyphens, and underscores.\
    \ NO spaces or other characters are allowed. By default, the product name is used as the slug.   \
    \             |\n| status                           | Required | The status of a product, either `Draft`\
    \ or `Live`.    |                                                  \n| commodity_type            \
    \       | Required | The commodity type, either `physical` or `digital`.    |                    \
    \                             \n| upc_ean                          | Optional | The universal product\
    \ code or european article number of the product.     |                               \n| mpn    \
    \                          | Optional | The manufacturer part number of a product.       |       \
    \                                                 \n| sku                              | Optional\
    \ | The unique stock keeping unit of the product.   |   \n| tags                             | Optional\
    \ | The product tags used to store or assign a key word against a product. A product can have up to\
    \ 20 product tags. A product tag can be up to 255 characters. See [**Product Tags**](/docs/api/pxm/products/product-tags\n\
    ).                                                   |\n| main_image_id                    | Optional\
    \ | Specifies a unique ID of a main image file for a product. See [Exporting Main Image Files](#exporting-main-image-files).\
    \  |                                                                                             \
    \                          \n| `_created_at`                      | Optional| The date and time a\
    \ product was created. **Note**: This field does not populate any data; it is provided solely for\
    \ informational purposes.      |                                                                 \
    \                                              \n| `_updated_at`                      | Optional |\
    \ The date and time a product was updated. **Note**: This field does not populate any data; it is\
    \ provided solely for informational purposes.        |                                           \
    \                                                                  \n| `template:<templateID>:created_at`\
    \ | Optional | The date and time a template was created. **Note**: This field does not populate any\
    \ data; it is provided solely for informational purposes.         |                              \
    \                                                                             \n| `template:<templateID>:updated_at`\
    \ | Optional | The date and time a template was updated. **Note**: This field does not populate any\
    \ data; it is provided solely for informational purposes.      |                                 \
    \                                                                             \n| `template:<flowID>:<fieldName>`\
    \  | Optional | Custom extension data includes the flow `ID` or `slug` and the field `name`. See [Exporting\
    \ Custom Data (Flows)](#exporting-custom-data-flows).   |                                        \
    \                                                                      \n\n### Exporting Main Image\
    \ Files\n\nThe main images that you have previously uploaded Commerce are exported. A `main_image_id`\
    \ header is added to your `.csv` file. The ID in `main_image_id` is the ID of a file that has already\
    \ been uploaded to Commerce using [create a file](/docs/api/pxm/files/create-a-file).\n\n### Exporting\
    \ Custom Data (Flows)\n\nCustom extension data is exported in a `.csv` file by creating a header that\
    \ includes the flow `ID` or `slug` and the field `name` as shown below:\n\n- `template:<flowSlug>:<fieldName>`\n\
    - `template:<flowID>:<fieldName>`\n\nwhere:\n\n- `template` must be `template`.\n- one of the following\
    \ for the template that contains the field whose data you want to export:\n  - `flowID` is the ID\
    \ of the flow.\n  - `flowSlug` is the flow slug.\n- `fieldName` is the name of the field whose data\
    \ you want to export.\n\nIn the following example, for a flow with ID `82c10a02-1851-4992-8ecb-d44f2782d09b`\
    \ and a field with the name `condition`:\n\n- the header is `template:82c10a02-1851-4992-8ecb-d44f2782d09b:condition`.\n\
    - the updated custom data is `as-new`.\n\n| name | slug | sku | status | template:82c10a02-1851-4992-8ecb-d44f2782d09b:condition\
    \ |\n| :--- | :--- | :--- | :--- | :--- |\n| BestEver Range | bestever-range-1a1a-30 | BE-Range-1a1a-30\
    \ | draft | as-new |"
