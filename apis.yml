- aid: elastic-path:elastic-path-customer-cart-associations-api
  name: Elastic Path Customer Cart Associations API
  description: >-
    You can create associations between a customer and one or more carts. After cart associations exist
    for a customer, those carts are accessible across any device. You can delete associations as required.


    There are two ways to access the cart: with a customer token and without one.


    ### With a `customer` token


    These endpoints are for users who authenticated implicitly and require a customer token in the header
    to access the customer cart associations APIs. For more information, see the [Customer Token](/docs/customer-management/customer-management-api/customer-tokens)
    documentation.


    #### Cart creation


    Shoppers create carts and can use any of the carts that they created to check out an order.


    :::note


    You can create a cart id, name, and description for the cart. The cart requires a name. Ensure that
    the string length is greater than or equal to one. Use any symbol in the name and description. For
    cart id, ensure that you follow the guidelines for safe characters. For more information about cart
    id naming requirements, see [Safe Characters](/guides/Getting-Started/safe-characters).


    :::


    ### Without a `customer` token


    These endpoints are for users who use the Client Credentials Token and do not require a Customer token
    in the header to access the customer cart associations APIs. For more information, see the [Authentication](/docs/authentication/security)
    documentation.


    This user acts as a system administrator and can call any customer cart association operations for
    any customer and cart.


    ### Error Codes


    You might encounter the following response codes, depending on the scenario:


    * `400` - `The type does not exist or is not listed as customer` - Ensure that the type is `customer`
    and is present.


    * `403` - `Cannot associate more than one customer`.


    * `403` - `Customer does not have the required permissions to fulfill this request`.


    * `403` - `Invalid json payload` - Check JSON input. The request body must be an array `[]`. If the
    request body is an object, the error is generated.
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Customer Cart Associations
  properties:
  - type: OpenAPI
    url: openapi/elastic-path-customer-cart-associations-api-openapi.yml
  - type: Documentation
    url: https://developer.elasticpath.com/api
- aid: elastic-path:elastic-path-dunning-rules-api
  name: Elastic Path Dunning Rules API
  description: >-
    Dunning is the process of handling failed payment attempts. This is important for recovering revenue
    from failed payments, reduces customer churn and maintains cashflow. By implementing efficient dunning
    processes, you can enhance financial health and operational efficiency.


    Subscriptions enables you to create a dunning rule that allows you to configure payment retry schedules.
    Subscriptions retries failed payments automatically. You can customize the timing and frequency of
    the payment retries.


    Dunning is enabled by default. You can choose to disable dunning. If no dunning rule is configured,
    then payment is retried once a day for 10 days, in total 11 payments. You can decide what action to
    take after the Subscriptions has stopped retrying the payments.


    - Do nothing - the subscription remains active and Subscriptions does not attempt to retry the payment.
    However, the subscription is still available for a subscriber to use.

    - Suspend the subscription. Subscriptions does not attempt to retry the payment. A subscriber can
    choose to pay the outstanding invoice. However, a subscriber cannot renew their subscription; a merchandizer
    must renew the subscription on behalf of the subscriber.

    - close a subscription. The subscription ends and it's status becomes `inactive`. However, a merchandizer
    can choose to resume the subscription if a subscriber pays the outstanding payment.
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Dunning Rules
  properties:
  - type: OpenAPI
    url: openapi/elastic-path-dunning-rules-api-openapi.yml
  - type: Documentation
    url: https://developer.elasticpath.com/api
