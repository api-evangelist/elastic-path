- aid: elastic-path:elastic-path-custom-apis-api
  name: Elastic Path Custom APIs API
  description: >-
    Custom APIs allow you to extend the capabilities of Commerce. With Custom APIs, you can efficiently
    manage large data sets while benefiting from both simple and complex multidimensional filtering options.
    Combining Custom APIs with [Composer](/docs/composer/index) enables you to deploy custom behaviors
    and integrations, allowing you to implement capabilities unique to your business without having to
    build and host that functionality from scratch.


    A Custom API is composed of one or more [Custom Fields](/docs/api/commerce-extensions/custom-fields)
    and allows you to create [Entries](/docs/api/commerce-extensions/custom-api-entries). In database
    terms, a Custom API can be thought of as a table, with fields representing the columns of the table,
    and entries serving as the database records.


    ## Custom APIs vs Non-Core Flows


    Custom APIs are the next generation of Non-Core Flows. Here is a comparison of current features of
    Non-Core Flows and Custom APIs. This will be updated as we release more capabilities.


    | Feature                                                                                                                   |
    Non-Core Flows | Commerce Extensions                                            |

    |---------------------------------------------------------------------------------------------------------------------------|----------------|----------------------------------------------------------------|

    | Build new APIs                                                                                                            |
    ✅              | ✅                                                              |

    | Access Level                                                                                                              |
    Implicit       | [Customizable](/docs/api/permissions/custom-api-role-policies) |

    | [Filtering](/docs/api/commerce-extensions/list-custom-api-entries#filtering)                                              |
    ⛔️             | ✅                                                              |

    | [Sorting](/docs/api/commerce-extensions/list-custom-api-entries#sorting)                                                  |
    ⛔️             | ✅                                                              |

    | [Events](/docs/api/commerce-extensions/custom-api-entries#events)                                                         |
    ⛔️             | ✅                                                              |

    | [Conditional Updates](/guides/How-To/commerce-extensions/create-a-multilocation-inventories-resource#conditional-updates)
    | ⛔️             | ✅                                                              |


    The [Custom Fields Overview](/docs/api/commerce-extensions/custom-fields) lists the comparison of
    different types and validation available in Custom APIs vs Non-Core Flows.
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
