- aid: elastic-path:elastic-path-orders-api
  name: Elastic Path Orders API
  description: >-
    An Order is created through the [checkout](/docs/api/carts/checkout) endpoint within the Carts API.


    An order is created after a customer checks out their cart. On creation, the order is marked unpaid.
    The customer is prompted for a shipping address, a billing address, and a payment method. After the
    order is successfully paid, you can trigger an inventory process and a shipping process.


    You can keep a history of orders associated with the customer account.


    ### Reorder


    A re-order is when a shopper copies items from a previous order from their order history into a cart
    of their choice. If a shopper re-orders to an empty cart, the same quantities as the past order are
    applied. If the shopper re-orders to an existing cart, and orders the same item, the quantity increases.
    If an item is out of stock, the item is not added to the cart, and the shopper sees an insufficient
    stock error. The tax for the items in a re-order is not applied. For more information, see [Tax Items](/docs/api/carts/tax-items).
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Order
  tags_raw:
  - Orders
  properties:
  - type: OpenAPI
    url: openapi/elastic-path-orders-api-openapi.yml
  - type: Documentation
    url: https://developer.elasticpath.com/api
- aid: elastic-path:elastic-path-password-profiles-api
  name: Elastic Path Password Profiles API
  description: >-
    A `password_profile` resource represents a specific configuration that allows users to authenticate
    through username and password.


    Password Profiles support One-Time Password Tokens, which can be used to use passwordless login or
    password reset.


    An authentication realm can have multiple Password Profiles. You can use this flexibility in many
    ways. For instance, if you want to migrate an existing pool of users from another system with their
    own usernames and passwords, they can use one profile, while the rest of the users use another.


    Another use case is enabling shopper impersonation, where shoppers can authenticate using their own
    username and password in one profile. Meanwhile, admins can have a different username and password
    for the same user in a separate profile, shown as the "Impersonation Profile". This process can be
    automated using a Backend-For-Frontend (BFE) or One-Time Password Tokens. In the example shown below,
    both John and Joan can log in with their credentials, and an admin can also log in as Joan using the
    "Impersonation Profile".


    ![password profiles](/assets/password-profiles.png)
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
