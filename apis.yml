- aid: elastic-path:elastic-path-offerings-api
  name: Elastic Path Offerings API
  description: "An offering is a combination of plans and pricing options; plans are combined with one\
    \ or more pricing options to form an offering. \n\nFor example, your company provides online\n streaming\
    \ of movies, web-series, and music. Your customers can purchase these services through either a weekly\
    \ or monthly pricing option.\n\nOffering plans can be either:\n\n- a subscription plan, created within\
    \ an offering.\n- a Product Experience Manager product, see [**Create a product**](/docs/api/pxm/products/create-product)\n\
    \n### Offering Examples\n\nOfferings can have any combination of plans and pricing options. The pricing\
    \ of an offering is determined by the pricing you have configured for your plans and pricing options.\n\
    \n| Example | Plan | Pricing options | Offering |\n| --- | --- | --- | --- |\n| Single plan and pricing\
    \ option | One plan with a plan price of $50 | A monthly pricing option with a 5% discount | An offering\
    \ with a monthly pricing option for $47.50 a month |\n| Single plan with multiple pricing options\
    \ | One plan with a plan price of $50 | <ul><li>A monthly pricing option with a 5% discount</li><li>A\
    \ yearly pricing option with a 10% discount</li></ul> | An offering with two pricing options: <ul><li>A\
    \ monthly pricing option for $47.50 a month</li><li>A yearly pricing option for $45 a month</li></ul>\
    \ |\n| Multiple plans and pricing option | Two plans: <ul><li>One plan with a plan price of $50.</li><li>One\
    \ plan with a plan price of $75.</li></ul> | A monthly pricing option with a 5% discount. | An offering\
    \ with a monthly pricing option for $118.75 a month. | \n| Multiple plans with multiple pricing options\
    \ | Two plans: <ul><li>One plan with a plan price of $50.</li><li>One plan with a plan price of $75.</li></ul>\
    \ | <ul><li>A monthly pricing option with a 5% discount</li><li>A yearly pricing option with a 10%\
    \ discount</li></ul> | An offering with two pricing options: <ul><li>A monthly pricing option for\
    \ $118.75 a month</li><li>A yearly pricing option for $112.50 a month</li></ul> | \n\n### Building\
    \ an Offering\n\nWhen you are building an offering:\n\n- you can create new pricing options and plans.\n\
    - you can modify existing plans and pricing options. For example, you can modify the plan price or\
    \ any attributes of a pricing option included in the offering.\n\nHere's how you build an offering:\n\
    \nWhen [**building your offerings**](/docs/api/subscriptions/build-offering) you must supply the plans\
    \ and pricing options that a customer can choose. An offering can consist of many combinations of\
    \ a plan or pricing options, depending on the plans and services you offer.\n\nPlans can either be\
    \ subscription plans or Product Experience Manager products. To create a Product Experience Manager\
    \ product, see [**Create a product**](/docs/api/pxm/products/create-product)\n\nPricing options are\
    \ the rules that govern your subscription, for example, any discount. \n - You can combine and reuse\
    \ pricing options for as many plans as you want, making it quick and easy to create your subscription\
    \ offerings. \n - An offering must have at least one pricing option.\n - Each plan must have the appropriate\
    \ pricing option associated with it\n\nWhen a [**customer**](/docs/api/subscriptions/subscribers)\
    \ chooses a plan and pricing option, a subscription is created. See [**Subscriptions**](/docs/api/subscriptions/subscriptions).\
    \ Elastic Path Subscriptions manages the billing and recurring payments associated with the subscription.\
    \ See [**Invoicing and Billing**](/docs/api/subscriptions/jobs).\n\n### Editing Offerings\n\nAfter\
    \ saving an offering, you can, at any time:\n\n- update an offering's details, for example, name or\
    \ description. See [**Update an Offering**](/docs/api/subscriptions/update-offering).\n- update an\
    \ existing plan in an offering. See [**Update a plan in an offering**](/docs/api/subscriptions/update-offering-plan)\n\
    - add a new plan in an offering. See [**Create a plan inside an offering**](/docs/api/subscriptions/create-offering-plan)\n\
    - remove plans. See [**Remove a plan from an offering**](/docs/api/subscriptions/delete-offering-plan).\n\
    - update an existing pricing option in an offering. See [**Update a pricing option in an offering**](/docs/api/subscriptions/update-offering-pricing-option)\n\
    - add a new pricing option to an offering. See [**Create a pricing option inside an offering**](/docs/api/subscriptions/create-offering-pricing-option).\n\
    - remove pricing options. See [**Removing a pricing option from an offering**](/docs/api/subscriptions/delete-offering-plan).\n\
    \nAny modifications that you make to offerings, and plans or pricing options in an offering, does\
    \ not affect any active subscriptions. The changes take effect on all new subscriptions that are created."
  humanURL: https://developer.elasticpath.com/api
  baseURL: https://useast.api.elasticpath.com
  tags:
  - Offerings
  properties:
  - type: OpenAPI
    url: openapi/elastic-path-offerings-api-openapi.yml
  - type: Documentation
    url: https://developer.elasticpath.com/api
