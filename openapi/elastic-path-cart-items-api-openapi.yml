      operationId: getCartItems
      parameters:
      - name: cartID
        in: path
        description: The unique identifier of the cart that you created.
        required: true
        style: simple
        schema:
          type: string
      - name: include
        in: query
        description: A comma-separated list of related resources to include in the response.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - tax_items
            - custom_discounts
            - promotions
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemCollectionResponse'
      deprecated: false
    put:
      tags:
      - Cart Items
      summary: Bulk Update Items in Cart
      description: 'The bulk update feature allows shoppers to update an array of items to their cart in one action, rather than updating each item one at a time. Shoppers can update quantity and shipping group details in bulk requests. This minimizes the time for shoppers while updating items to their cart. Shoppers can even update multiple items with the same or different shipping groups to their cart.


        When you update multiple items that qualify for free gifts in the cart, the corresponding free gifts for all eligible products are also automatically updated in the cart.'
      operationId: bulkUpdateItemsInCart
      parameters:
      - name: cartID
        in: path
        description: The unique identifier of the cart that you created.
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/BulkUpdateCartsItems'
        required: false
      responses:
        '200':
          description: Successfully updated cart items
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemCollectionResponse'
        '400':
          description: Insufficient Stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response.ErrorResponse'
              examples:
                default:
                  summary: Insufficient Stock
                  value:
                    errors:
                    - detail: There is not enough stock to add Fry Pan to your cart
                      meta:
                        id: 0e5bae32-cc71-4ede-8d7d-cb662e90c542
                      status: 400
                      title: Insufficient stock
        '403':
          description: Unauthorized call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response.ErrorResponse'
              examples:
                default:
                  summary: No permissions to use custom attributes
                  value:
                    errors:
                    - detail: No permissions to fulfill this request with cart item custom_attributes
                      meta:
                        id: 0e5bae32-cc71-4ede-8d7d-cb662e90c542
                      status: 403
                      title: Unauthorised call
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response.ErrorResponse'
              examples:
                default:
                  summary: Not Found
                  value:
                    errors:
                    - detail: Item was not found in the cart
                      meta:
                        id: 0e5bae32-cc71-4ede-8d7d-cb662e90c542
                        ids:
                        - 0e5bae32-cc71-4ede-8d7d-cb662e90c542
                      status: 404
                      title: Not Found
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response.ErrorResponse'
              examples:
                default:
                  summary: Could not apply EP promotion with the given code
                  value:
                    errors:
                    - detail: The cart is configured to use custom discounts
                      meta:
                        code: 10_OFF
                        ids:
                        - 0e5bae32-cc71-4ede-8d7d-cb662e90c542
                      status: 422
                      title: Could not apply EP promotion with the given code
      deprecated: false
    post:
      tags:
      - Cart Items
      summary: Add Items to Cart
      description: '### Add Product to Cart


        Adding a Product to Cart is the most common Cart action.'
      operationId: manageCarts
      parameters:
      - name: cartID
        in: path
        description: The unique identifier of the cart that you created.
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/CartItemObjectRequest'
              - $ref: '#/components/schemas/SubscriptionItemObject'
              - $ref: '#/components/schemas/CartMergeObjectRequest'
              - $ref: '#/components/schemas/CustomItemObject'
              - $ref: '#/components/schemas/ReOrderObjectRequest'
              - $ref: '#/components/schemas/PromotionItemObject'
              - $ref: '#/components/schemas/BulkAddItemsRequest'
            examples:
              Add Cart Item:
                value:
                  data:
                    type: cart_item
                    id: df32387b-6ce6-4802-9b90-1126a5c5a54f
                    quantity: 1
                    custom_inputs:
                      name:
                        tshirt_front: Jane
                        tshirt_back: Jane Doe's Dance Academy
              Add Subscription Item:
                value:
                  data:
                    type: subscription_item
                    id: 1f49c20c-54b9-453b-a57c-ef8303a6415f
                    quantity: 1
                    subscription_configuration:
                      plan: dfa31307-748c-4369-8571-709f924a0807
                      pricing_option: a2cd9dae-3a28-4185-93b7-1b02a8ce0c2e
              Add Custom Item:
                value:
                  data:
                    type: custom_item
                    name: My Custom Item
                    sku: my-custom-item
                    description: My first custom item!
                    quantity: 1
                    price:
                      amount: 10000
              Add Promotion to Cart:
                value:
                  data:
                    type: promotion_item
                    code: PROMO_CODE
              Reorder Items:
                value:
                  data:
                    type: order_items
                    order_id: da0b0a12-8232-4be1-a354-a1a64b11de91
                  options:
                    add_all_or_nothing: false
              Merge Carts:
                value:
                  data:
                  - type: cart_items
                    cart_id: da0b0a12-8232-4be1-a354-a1a64b11de91
                  options:
                    add_all_or_nothing: false
              Bulk Add Items to Cart:
                value:
                  data:
                  - type: cart_item
                    id: df32387b-6ce6-4802-9b90-1126a5c5a54f
                    quantity: 1
                  - type: custom_item
                    name: My Custom Item
                    sku: my-custom-item
                    description: My first custom item!
                    quantity: 1
                    price:
                      amount: 10000
                  - type: promotion_item
                    code: PROMO_CODE
                  options:
                    add_all_or_nothing: true
              Add Bundle to Cart:
                value:
                  data:
                    id: 5ab67bb3-b2c3-4348-af33-e370bd39b0c9
                    type: cart_item
                    quantity: 1
                    bundle_configuration:
                      selected_options:
                        tshirt:
                          23759a57-13c1-4887-9ec2-fb47444751bd: 1
                        comics:
                          c7bcf7fd-1fab-4635-8ae0-7f187a9dbbce: 1
                          d9768b40-cf28-406e-bafc-a6d130627eca: 1
              Add Item with Shipping Group ID:
                value:
                  data:
                    type: custom_item
                    name: My Custom Item
                    sku: my-custom-item
                    description: My first custom item!
                    quantity: 1
                    price:
                      amount: 10000
                      includes_tax: true
                    shipping_group_id: eb063818-939a-458f-97a4-2601c0c2b445
      responses:
