openapi: 3.2.0
info:
  title: Carts, Checkout, Orders Introduction Cart Items API
  description: A cart contains a list of the products that a shopper adds to the cart while browsing your catalog.
  contact:
    name: Elastic Path
    url: https://elasticpath.com
  version: 26.0313.7324347
  x-version-timestamp: 2026-03-13 21:22:42+00:00
  license:
    name: MIT
    url: assets/LICENSE
servers:
- url: https://useast.api.elasticpath.com
  description: US East Production Server
  variables: {}
- url: https://euwest.api.elasticpath.com
  description: EU West Production Server
  variables: {}
security:
- bearerAuth: []
tags:
- name: Cart Items
  description: Products added to a cart are referred to as a `cart_item`.
paths:
  /v2/carts/{cartID}/items:
    parameters: []
    get:
      tags:
      - Cart Items
      summary: Get Cart Items
      description: 'Use this endpoint to retrieve cart items. If the cart is associated with shipping groups, calling this endpoint displays the associated shipping group IDs.


